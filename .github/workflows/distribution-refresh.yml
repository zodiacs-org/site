name: Distribution Refresh

# Refreshes public/assets/distribution.json (the on-chain ownership-spread
# snapshot behind The Standings). Best-effort: when the public RPC
# rate-limits the runner, previous per-sign values are kept.

on:
  schedule:
    - cron: "31 6 * * 1" # Mondays 06:31 UTC
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh distribution data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # build-sign-pages.mjs imports sharp (through build-registry-og.mjs) since
      # mid-October; without the dependencies installed the job crashed every
      # week after the RPC step.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build distribution data
        run: node scripts/build-distribution.mjs

      - name: Regenerate Registry profiles
        run: node scripts/build-sign-pages.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet public/assets/distribution.json public/registry/; then
            echo "distribution data and Registry profiles unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/distribution.json public/registry/
          git commit -m "Refresh Registry distribution data"
          git push
