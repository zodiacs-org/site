name: Read-only recovery of successful source-bound capture artifact
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/checkpoint25-home-report-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      differing: ${{ steps.recovery.outputs.differing }}
    steps:
      - name: Verify original ZIP digest and CRC; recover exact reports
        id: recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'RECOVER'
          import os,json,hashlib,base64,urllib.request,urllib.error,zipfile,io
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          api='https://api.github.com/repos/zodiacs-org/site/actions/artifacts/11667475025/zip'
          opener=urllib.request.build_opener(NoRedirect)
          request=urllib.request.Request(api,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
           with opener.open(request,timeout=30) as response:packed=response.read()
          except urllib.error.HTTPError as error:
           if error.code!=302:raise
           location=error.headers['Location']
           assert location.startswith('https://')
           # The signed external URL receives no GitHub Authorization header.
           with urllib.request.urlopen(urllib.request.Request(location),timeout=60) as response:packed=response.read()
          assert hashlib.sha256(packed).hexdigest()=='a990349227f3fb41295a82f458482b66c1fefaac6285fbcf2b6edbc06319098f'
          archive=zipfile.ZipFile(io.BytesIO(packed))
          assert archive.testzip() is None
          root='docs/platform/evidence/home-poster-loading-20261010/'
          def export(path,data):
           digest=hashlib.sha256(data).hexdigest()
           if len(data)<=49152:
            print('PROGRAMME_FILE '+json.dumps({'path':path,'size':len(data),'sha256':digest,'base64':base64.b64encode(data).decode()},separators=(',',':')))
           else:
            parts=[data[i:i+16384] for i in range(0,len(data),16384)]
            print('PROGRAMME_FILE_INDEX '+json.dumps({'path':path,'size':len(data),'sha256':digest,'chunks':len(parts)},separators=(',',':')))
            for index,part in enumerate(parts):print('PROGRAMME_FILE_CHUNK '+json.dumps({'path':path,'index':index,'base64':base64.b64encode(part).decode()},separators=(',',':')))
          proof=json.loads(archive.read('checkpoint25-home-capture-producer.json'))
          assert proof['checkedOutSource']=='2e08e201aea43b7e23fed8723363213ea1ff82df'
          assert proof['producer']['run']=='38043051385'
          assert proof['producer']['workflowSource']=='5b31d4850bb07c27a3f047bcb231d06e49c1d839'
          assert len(proof['captures'])==18
          manifestPath='docs/acceptance/phase1/screenshots/manifest.json'
          manifest=archive.read(manifestPath)
          assert hashlib.sha256(manifest).hexdigest()==proof['manifestSha256']
          changed=[row['file'] for row in proof['captures'] if not row['identicalToPreviousTracked']]
          if os.environ.get('IMAGE_FILE'):
           file=os.environ['IMAGE_FILE']
           assert file in changed
           path='docs/acceptance/phase1/screenshots/'+file
           data=archive.read(path)
           row=next(row for row in proof['captures'] if row['file']==file)
           assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
           export(path,data)
          else:
           for path in [root+'hydration-controls.json',root+'preflight.json']:
            data=archive.read(path)
            doc=json.loads(data)
            assert doc['checkedOutSource']==proof['checkedOutSource']
            assert doc['producer']['run']==proof['producer']['run']
            export(path,data)
           export(manifestPath,manifest)
           export(root+'phase1-capture-producer.json',archive.read('checkpoint25-home-capture-producer.json'))
           with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('differing='+json.dumps(changed,separators=(',',':'))+'\n')
           print('CAPTURE_RECOVERY '+json.dumps({'artifact':11667475025,'verifiedZipSha256':hashlib.sha256(packed).hexdigest(),'crcVerified':True,'actual':18,'differing':changed},separators=(',',':')))
          
          RECOVER
  images:
    needs: reports
    if: needs.reports.outputs.differing != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        file: ${{ fromJSON(needs.reports.outputs.differing) }}
    steps:
      - name: Recover one verified actual capture without a browser rerun
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_FILE: ${{ matrix.file }}
        run: |
          python3 <<'RECOVER'
          import os,json,hashlib,base64,urllib.request,urllib.error,zipfile,io
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          api='https://api.github.com/repos/zodiacs-org/site/actions/artifacts/11667475025/zip'
          opener=urllib.request.build_opener(NoRedirect)
          request=urllib.request.Request(api,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
           with opener.open(request,timeout=30) as response:packed=response.read()
          except urllib.error.HTTPError as error:
           if error.code!=302:raise
           location=error.headers['Location']
           assert location.startswith('https://')
           # The signed external URL receives no GitHub Authorization header.
           with urllib.request.urlopen(urllib.request.Request(location),timeout=60) as response:packed=response.read()
          assert hashlib.sha256(packed).hexdigest()=='a990349227f3fb41295a82f458482b66c1fefaac6285fbcf2b6edbc06319098f'
          archive=zipfile.ZipFile(io.BytesIO(packed))
          assert archive.testzip() is None
          root='docs/platform/evidence/home-poster-loading-20261010/'
          def export(path,data):
           digest=hashlib.sha256(data).hexdigest()
           if len(data)<=49152:
            print('PROGRAMME_FILE '+json.dumps({'path':path,'size':len(data),'sha256':digest,'base64':base64.b64encode(data).decode()},separators=(',',':')))
           else:
            parts=[data[i:i+16384] for i in range(0,len(data),16384)]
            print('PROGRAMME_FILE_INDEX '+json.dumps({'path':path,'size':len(data),'sha256':digest,'chunks':len(parts)},separators=(',',':')))
            for index,part in enumerate(parts):print('PROGRAMME_FILE_CHUNK '+json.dumps({'path':path,'index':index,'base64':base64.b64encode(part).decode()},separators=(',',':')))
          proof=json.loads(archive.read('checkpoint25-home-capture-producer.json'))
          assert proof['checkedOutSource']=='2e08e201aea43b7e23fed8723363213ea1ff82df'
          assert proof['producer']['run']=='38043051385'
          assert proof['producer']['workflowSource']=='5b31d4850bb07c27a3f047bcb231d06e49c1d839'
          assert len(proof['captures'])==18
          manifestPath='docs/acceptance/phase1/screenshots/manifest.json'
          manifest=archive.read(manifestPath)
          assert hashlib.sha256(manifest).hexdigest()==proof['manifestSha256']
          changed=[row['file'] for row in proof['captures'] if not row['identicalToPreviousTracked']]
          if os.environ.get('IMAGE_FILE'):
           file=os.environ['IMAGE_FILE']
           assert file in changed
           path='docs/acceptance/phase1/screenshots/'+file
           data=archive.read(path)
           row=next(row for row in proof['captures'] if row['file']==file)
           assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
           export(path,data)
          else:
           for path in [root+'hydration-controls.json',root+'preflight.json']:
            data=archive.read(path)
            doc=json.loads(data)
            assert doc['checkedOutSource']==proof['checkedOutSource']
            assert doc['producer']['run']==proof['producer']['run']
            export(path,data)
           export(manifestPath,manifest)
           export(root+'phase1-capture-producer.json',archive.read('checkpoint25-home-capture-producer.json'))
           with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('differing='+json.dumps(changed,separators=(',',':'))+'\n')
           print('CAPTURE_RECOVERY '+json.dumps({'artifact':11667475025,'verifiedZipSha256':hashlib.sha256(packed).hexdigest(),'crcVerified':True,'actual':18,'differing':changed},separators=(',',':')))
          
          RECOVER
