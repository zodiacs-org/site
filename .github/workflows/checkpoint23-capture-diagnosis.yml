name: Read-only retained Phase 1 capture diagnosis
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: ['.github/workflows/checkpoint23-capture-diagnosis.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '862e31e42aab89d7050b20f3be003edf7691ba48'
          path: target
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '365057b2395928b43f6b3a3efe2ec50346090608'
          path: tested
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Compare raw source boundaries of the two exact commits
        run: |
          node --input-type=module <<'SOURCE_DIAG'
          import { phase1TemplateSourceSha256 } from './target/tests/visual/phase1-evidence-contract.mjs';
          import { resolve } from 'node:path';
          console.log('PROGRAMME_DIAGNOSTIC ' + JSON.stringify({
            targetRawSourceHash: await phase1TemplateSourceSha256(resolve('target')),
            testedRawSourceHash: await phase1TemplateSourceSha256(resolve('tested')),
            target: '862e31e42aab89d7050b20f3be003edf7691ba48',
            tested: '365057b2395928b43f6b3a3efe2ec50346090608',
          }));
          
          SOURCE_DIAG
      - name: Verify retained ZIP and read only its receipt metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'ZIP_DIAG'
          import os, json, hashlib, urllib.request, zipfile, io, base64
          class RedirectWithoutAuth(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(RedirectWithoutAuth())
          req = urllib.request.Request('https://api.github.com/repos/zodiacs-org/site/actions/artifacts/11616930539/zip',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with opener.open(req, timeout=60) as response: archive = response.read(20000000)
          assert len(archive) == 8665743
          assert hashlib.sha256(archive).hexdigest() == 'a4f1c2afeb2b3abcc0b16619ff5e92636240848686d578f655ab001bf81c146f'
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              matches = [name for name in bundle.namelist() if name == 'manifest.json' or name.endswith('/screenshots/manifest.json')]
              assert len(matches) == 1
              raw = bundle.read(matches[0])
              manifest = json.loads(raw)
              prefix = matches[0][:-len('manifest.json')]
              summary = {'schema': manifest['schema'], 'templateSourceSha256': manifest['templateSourceSha256'],
                  'browser': manifest['browser'], 'capturedAt': manifest['capturedAt'], 'buildReceipt': manifest['buildReceipt'],
                  'captures': len(manifest['captures']), 'manifestSha256': hashlib.sha256(raw).hexdigest(),
                  'artifactId': 11616930539, 'archiveSha256': hashlib.sha256(archive).hexdigest()}
              print('PROGRAMME_DIAGNOSTIC ' + json.dumps(summary))
          
          ZIP_DIAG
  export-part:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: ["manifest.json","today-360.png","today-1280.png","horoscopes-hub-360.png","horoscopes-hub-1280.png","daily-360.png","daily-1280.png","tomorrow-360.png","tomorrow-1280.png","weekly-360.png","weekly-1280.png","monthly-360.png","monthly-1280.png","love-360.png","love-1280.png","career-360.png","career-1280.png","yearly-360.png","yearly-1280.png"]
    env:
      CAPTURE_FILE: ${{ matrix.file }}
    steps:
      - name: Verify original ZIP and export one retained file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'ZIP_PART'
          import os, json, hashlib, urllib.request, zipfile, io, base64
          class RedirectWithoutAuth(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(RedirectWithoutAuth())
          req = urllib.request.Request('https://api.github.com/repos/zodiacs-org/site/actions/artifacts/11616930539/zip',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with opener.open(req, timeout=60) as response: archive = response.read(20000000)
          assert len(archive) == 8665743
          assert hashlib.sha256(archive).hexdigest() == 'a4f1c2afeb2b3abcc0b16619ff5e92636240848686d578f655ab001bf81c146f'
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              matches = [name for name in bundle.namelist() if name == 'manifest.json' or name.endswith('/screenshots/manifest.json')]
              assert len(matches) == 1
              raw = bundle.read(matches[0])
              manifest = json.loads(raw)
              prefix = matches[0][:-len('manifest.json')]
              summary = {'schema': manifest['schema'], 'templateSourceSha256': manifest['templateSourceSha256'],
                  'browser': manifest['browser'], 'capturedAt': manifest['capturedAt'], 'buildReceipt': manifest['buildReceipt'],
                  'captures': len(manifest['captures']), 'manifestSha256': hashlib.sha256(raw).hexdigest(),
                  'artifactId': 11616930539, 'archiveSha256': hashlib.sha256(archive).hexdigest()}
          
              for name in [os.environ['CAPTURE_FILE']]:
                  data = bundle.read(prefix + name)
                  if name != 'manifest.json':
                      row = next(row for row in manifest['captures'] if row['screenshot']['file'] == name)
                      assert hashlib.sha256(data).hexdigest() == row['screenshot']['sha256']
                  print('PROGRAMME_FILE ' + json.dumps({'path': 'docs/acceptance/phase1/screenshots/' + name,
                      'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'base64': base64.b64encode(data).decode()}))
          
          
          ZIP_PART
