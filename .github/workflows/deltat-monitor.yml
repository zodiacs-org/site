name: ΔT monitor

# Once a week, compares the engine's frozen ΔT table (model zodiacs-deltat/1)
# with IERS's finals2000A.all, and opens or comments on the issue
# "ΔT table needs a refresh" when the model has drifted from IERS or its
# predictions are about to run out. It also compares overlapping predictions
# for UT1 and checks for IANA time zone releases. A refresh is an engine
# release that the site takes through a normal pull request.
# Rules: docs/platform/evidence/deltat-2026-09-25/README.md, sections 6 and 11.

on:
  schedule:
    - cron: "23 6 * * 5" # Fridays 06:23 UTC, the day after Bulletin A
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deltat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check IERS and IANA data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check IERS and IANA data
        id: monitor
        run: >-
          node scripts/deltat-monitor.mjs
          --issue-body "$RUNNER_TEMP/deltat-issue.md"
          --tz-issue-body "$RUNNER_TEMP/tzdb-issue.md"

      - name: Open or update the refresh issue
        if: steps.monitor.outputs.status == 'fired' || steps.monitor.outputs.status == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="ΔT table needs a refresh"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == "ΔT table needs a refresh") | .number' | head -n 1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/deltat-issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/deltat-issue.md"
          fi

      - name: Open or update the time zone refresh issue
        if: steps.monitor.outputs.tz_status == 'fired'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Time zone data needs a refresh"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == "Time zone data needs a refresh") | .number' | head -n 1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/tzdb-issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/tzdb-issue.md"
          fi

      - name: Mark the run failed when source data could not be read
        if: steps.monitor.outputs.status == 'failed' || steps.monitor.outputs.tz_status == 'failed'
        run: |
          echo "Source data could not be read. See the monitor summary for details." >&2
          exit 1
