name: Read-only failed homepage and passing predecessor comparison
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/checkpoint25-home-comparison.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify retained original archives and inspect raw home and thesis reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'HOME_COMPARISON'
          import base64, hashlib, io, json, os, urllib.parse, urllib.request, zipfile
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, url):
                  result=super().redirect_request(req,fp,code,msg,headers,url)
                  if result is not None and urllib.parse.urlsplit(url).hostname!='api.github.com':result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(Redirect())
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/zodiacs-org/site'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with opener.open(req,timeout=60) as response:data=response.read(200000001)
              assert len(data)<=200000000
              return data
          def bounded(value,depth=0):
              if depth>7:return None
              if isinstance(value,str):
                  if value.startswith('data:'):return '[omitted inline data]'
                  return value[:600]
              if isinstance(value,list):return [bounded(v,depth+1) for v in value[:16]]
              if isinstance(value,dict):return {k:bounded(v,depth+1) for k,v in list(value.items())[:48] if not any(s in k.lower() for s in ['screenshot','thumbnail','datauri'])}
              return value
          def public_url(value):
              parsed=urllib.parse.urlsplit(value);return urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path,'',''))
          cases=[
           {'run':37962304681,'source':'50636624a8677da3644987cfa4fe735e811650f3','integration':'45fc46b25fd96a17ae6029820f8382d623e7bdad','tree':'7d8126fc00dea60caebaf85540e2919c90dab72a','conclusion':'success','artifact':11634551439,'bytes':158914369,'sha256':'d7b777abb513f7e37df7c303a588c479cf6891b4edc6dbf424c44098e2029681'},
           {'run':37973273635,'source':'6d8b8a112b0ed079875e92e93ddcbf4444b4d658','integration':'53a3925683b65e72eeb5fb440bf225b51b1728d3','tree':'39cec9a839aa274bd77cc4657043220e4b11f434','conclusion':'failure','artifact':11639781725,'bytes':157960211,'sha256':'4606fb1b7527581ff4b2356baacb0643c1c2fb8bcb675b0a9c285bb851e268b6'}
          ]
          for case in cases:
              run=json.loads(get('/actions/runs/'+str(case['run'])))
              assert run['head_sha']==case['source'] and run['conclusion']==case['conclusion']
              archive=get('/actions/artifacts/'+str(case['artifact'])+'/zip')
              assert len(archive)==case['bytes'] and hashlib.sha256(archive).hexdigest()==case['sha256']
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  samples=[]
                  names=sorted(n for n in z.namelist() if 'lighthouse/' in n and any(n.endswith('/'+route+'-'+str(i)+'.json') for route in ['home','thesis'] for i in range(1,4)))
                  assert len(names)==6,names
                  for name in names:
                      data=z.read(name);lhr=json.loads(data);audits=lhr['audits']
                      row={'file':name,'sha256':hashlib.sha256(data).hexdigest(),'lcpMs':audits['largest-contentful-paint']['numericValue'],'fcpMs':audits['first-contentful-paint']['numericValue'],'cls':audits['cumulative-layout-shift']['numericValue'],'tbtMs':audits['total-blocking-time']['numericValue'],'scores':{k:lhr['categories'][k]['score'] for k in ['performance','accessibility','seo']}}
                      row['diagnostics']=bounded(audits.get('diagnostics',{}).get('details',{}))
                      row['insights']={k:bounded(v.get('details',{})) for k,v in audits.items() if any(t in k for t in ['lcp-breakdown','lcp-discovery','render-blocking','font-display','largest-contentful-paint-element','longest-tasks'])}
                      requests=audits.get('network-requests',{}).get('details',{}).get('items',[])
                      row['requests']=[{**{k:v for k,v in request.items() if k in ['startTime','endTime','transferSize','resourceSize','statusCode','mimeType','resourceType','priority','protocol','requestId','isLCPRequest']},'url':public_url(request.get('url',''))} for request in requests if request.get('resourceType') in ['Document','Stylesheet','Font','Script'] or 'poster' in request.get('url','')][:36]
                      samples.append(row)
                  case['samples']=samples
          report={'schema':'zodiacs.readonly-home-thesis-lighthouse-comparison.v1','producer':{'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID']},'cases':cases,'limitations':['Read-only original artifacts; no new browser run, source correction or acceptance.','Insights diagnose retained samples; observed differences alone do not prove a cause.']}
          data=(json.dumps(report,indent=2)+'\n').encode();assert len(data)<512000
          path='docs/platform/evidence/home-poster-loading-20261010/retained-comparison.json'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,'wb') as output:output.write(data)
          encoded=base64.b64encode(data).decode();chunks=[encoded[i:i+16384] for i in range(0,len(encoded),16384)]
          print('PROGRAMME_FILE_INDEX '+json.dumps({'path':path,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'chunks':len(chunks)},separators=(',',':')))
          for index,chunk in enumerate(chunks):print('PROGRAMME_FILE_CHUNK '+json.dumps({'path':path,'index':index,'base64':chunk},separators=(',',':')))
          
          HOME_COMPARISON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-home-thesis-comparison
          path: docs/platform/evidence/home-poster-loading-20261010/retained-comparison.json
          if-no-files-found: error
