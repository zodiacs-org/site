name: Read-only candidate and current-main source reconciliation
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/checkpoint25-source-reconcile.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE: '63dbcc0df75c655c2476af779f06e99f5a1cd6dd'
      CURRENT_MAIN: '943d11decff8c5cd417d315637aac2cf8c55fa01'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
          fetch-depth: 0
      - name: Merge sources locally and export actual index identities
        run: |
          node --input-type=module <<'RECONCILE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const git=(...args)=>execFileSync('git',args,{shell:false,maxBuffer:24*1024*1024});
          const text=(...args)=>git(...args).toString('utf8').trim();
          const candidate=process.env.CANDIDATE,main=process.env.CURRENT_MAIN;
          assert.equal(text('rev-parse','HEAD'),candidate);
          git('fetch','--no-tags','origin',main);
          assert.equal(text('merge-base',candidate,main),'ac09a5fab7e6674039876e15f4db4bc29b09e79f');
          git('config','user.name','Local source reconciliation');
          git('config','user.email','source-reconciliation@example.invalid');
          let mergeExit=0;
          try{git('merge','--no-commit','--no-ff',main);}catch(error){mergeExit=error.status;}
          const conflictsBefore=text('diff','--name-only','--diff-filter=U').split('\n').filter(Boolean);
          const manifest='docs/acceptance/phase1/screenshots/manifest.json';
          const resolutions=[];
          if(conflictsBefore.includes(manifest)){
           git('checkout',main,'--',manifest);
           resolutions.push({path:manifest,choice:'exact current-main tracked manifest',limitation:'Temporary source reconciliation only. Fresh actual captures must regenerate this receipt before acceptance.'});
          }
          const conflicts=text('diff','--name-only','--diff-filter=U').split('\n').filter(Boolean);
          const entries=[];
          const paths=git('diff','--cached','--name-only','-z',candidate).toString('utf8').split('\0').filter(Boolean);
          for(const path of paths){
           if(conflicts.includes(path))continue;
           const entry=text('ls-files','--stage','--',path);
           if(!entry){entries.push({path,mode:'100644',type:'blob',sha:null});continue;}
           const match=/^(\d+) ([a-f0-9]{40}) 0\t/.exec(entry);assert.ok(match,'stage-zero entry');
           const mode=match[1],sha=match[2];
           let mainSha=null,candidateSha=null;
           try{mainSha=text('rev-parse',main+':'+path);}catch{}
           try{candidateSha=text('rev-parse',candidate+':'+path);}catch{}
           const available=sha===mainSha||sha===candidateSha;
           entries.push({path,mode,type:'blob',sha,availableOnGitHub:available,mainSha,candidateSha});
           if(!available){
            const bytes=git('show',':'+path);
            assert.ok(!bytes.includes(0),'Merged new blob must be UTF-8 source');
            const chunks=Math.ceil(bytes.length/16384);
            console.log('PROGRAMME_FILE_INDEX '+JSON.stringify({path,size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),gitBlob:sha,chunks}));
            for(let index=0;index<chunks;index++)console.log('PROGRAMME_FILE_CHUNK '+JSON.stringify({path,index,base64:bytes.subarray(index*16384,(index+1)*16384).toString('base64')}));
           }
          }
          const report={schema:'zodiacs.read-only-source-reconciliation.v1',producer:{workflowSource:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID},candidate,main,mergeExit,conflictsBefore,resolutions,conflicts,entries,limitations:['Local Git source merge only; no build, browser, performance, acceptance, remote push or deployment.','Current-main design, navigation, daily publication and actual PNG objects are preserved.']};
          const bytes=Buffer.from(JSON.stringify(report,null,2)+'\n');
          writeFileSync('source-reconciliation.json',bytes);
          console.log('PROGRAMME_FILE '+JSON.stringify({path:'docs/platform/evidence/home-poster-loading-20261010/source-reconciliation.json',size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),base64:bytes.toString('base64')}));
          assert.equal(conflicts.length,0,'Unresolved conflicts require source correction');
          RECONCILE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-reconciliation
          path: source-reconciliation.json
          if-no-files-found: error
