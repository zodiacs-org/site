name: Retained homepage evidence diagnosis
on:
  push:
    branches:
      - codex/developer-docs-preparation
    paths:
      - '.github/workflows/home-evidence-diagnosis.yml'
      - 'scripts/diagnose-retained-home-evidence.py'
permissions:
  contents: read
  actions: read
jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify immutable archives and summarize original reports and traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose-retained-home-evidence.py
