name: Trending on X (drafts for review)

# Once a day, reads trending names (X trends when the X_BEARER_TOKEN secret
# is set, otherwise the names given to a manual run), matches them to the
# Year Ahead directory and uploads a report: a draft post per match for the
# marketing team, and the names not in the directory for human review.
# It never posts, never publishes, never commits and never adds anyone to the
# directory. Its only output is the workflow artifact.

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated names to check instead of X trends"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  trending:
    name: Match trending names and draft posts
    runs-on: ubuntu-latest
    # The X token is scoped to its own protected environment, as every secret-bearing workflow is.
    environment: trending-x-production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the report
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NAMES: ${{ github.event.inputs.names }}
        run: |
          if [ -n "$NAMES" ]; then
            npx vite-node --script scripts/trending-x.ts -- --names-list "$NAMES" --out trending-report
          elif [ -n "$X_BEARER_TOKEN" ]; then
            npx vite-node --script scripts/trending-x.ts -- --x-trends --out trending-report
          else
            echo "No names given and no X_BEARER_TOKEN secret; nothing to read today."
            mkdir -p trending-report
            echo "No input today: set the X_BEARER_TOKEN secret or run with names." > trending-report/README.md
          fi

      - name: Upload the report for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trending-x-${{ github.run_id }}
          path: trending-report/
          retention-days: 14
