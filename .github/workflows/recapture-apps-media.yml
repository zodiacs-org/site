name: Recapture apps media (temporary)

# Temporary: re-makes the /apps/ pictures, tour video and poster with the
# invented example details, and commits them back to this one branch.
# Removed again before the pull request is ready.
on:
  push:
    branches:
      - growth/recapture-apps-media

permissions:
  contents: read

concurrency:
  group: recapture-apps-media
  cancel-in-progress: false

jobs:
  recapture:
    name: Recapture the apps showcase media
    # Never run on the media commit this job pushes back.
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[apps-media-recapture]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SHOWCASE_DIR: public/assets/ai/showcase/20261116
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium and ffmpeg
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture the pictures
        run: |
          set +e
          node tests/manual/capture-apps-showcase.mjs --out "$RUNNER_TEMP/captures" > "$RUNNER_TEMP/captures.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/captures.log"
          if [ $status -ne 0 ]; then
            echo "::error title=capture-apps-showcase failed::$(tail -n 40 "$RUNNER_TEMP/captures.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $status
          fi

      - name: Record the tour
        run: |
          set +e
          node tests/manual/record-apps-tour.mjs --out "$RUNNER_TEMP/tour" > "$RUNNER_TEMP/tour.log" 2>&1
          status=$?
          tail -n 80 "$RUNNER_TEMP/tour.log"
          if [ $status -ne 0 ]; then
            echo "::error title=record-apps-tour failed::$(tail -n 40 "$RUNNER_TEMP/tour.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $status
          fi

      - name: Put the media in place
        run: |
          set -euo pipefail
          mkdir -p "$SHOWCASE_DIR"
          cp "$RUNNER_TEMP"/captures/*.webp "$SHOWCASE_DIR"/
          cp "$RUNNER_TEMP/tour/tour.mp4" "$RUNNER_TEMP/tour/demo-poster.webp" "$SHOWCASE_DIR"/
          cp "$RUNNER_TEMP/captures/captures.json" src/data/apps-showcase-images.json
          cp "$RUNNER_TEMP/tour/tour.json" src/data/apps-showcase-tour.json
          sed -i "s#const assetRoot = '/assets/ai/showcase/[0-9]*/';#const assetRoot = '/${SHOWCASE_DIR#public/}/';#" src/pages/apps/index.astro
          grep -q "const assetRoot = '/${SHOWCASE_DIR#public/}/';" src/pages/apps/index.astro
          git rm -r -q public/assets/ai/showcase/20261109 public/assets/ai/showcase/20261028
          ls -la "$SHOWCASE_DIR"

      - name: Commit the media
        run: |
          set -euo pipefail
          git add -A "$SHOWCASE_DIR" public/assets/ai/showcase src/data/apps-showcase-images.json src/data/apps-showcase-tour.json src/pages/apps/index.astro
          git -c user.name="Zodiacs Admin" -c user.email=admin@zodiacs.org commit -q -m "Recapture /apps/ pictures and tour with the invented examples [apps-media-recapture]"
          git push origin HEAD:growth/recapture-apps-media
