name: Account Deletion Receipt Cleanup

# The account retention pass (migration 20261113090000). Production has no
# pg_cron (13 Nov 2026), so this workflow is what runs the pass there. Where
# pg_cron is installed, the migration also schedules the hourly
# `account-v2-retention` job inside the database and this run is a second,
# independent pass.
# GitHub may start a scheduled run late or skip one. It fails loudly when the
# secret is missing or a deletion past its seven days is left unfinished.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-deletion-receipt-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: account-cleanup-production
    timeout-minutes: 5
    steps:
      - name: Run the retention pass
        env:
          ACCOUNT_SYNC_V2_CLEANUP_SECRET: ${{ secrets.ACCOUNT_SYNC_V2_CLEANUP_SECRET }}
        run: |
          if [ -z "$ACCOUNT_SYNC_V2_CLEANUP_SECRET" ]; then
            echo "::error::ACCOUNT_SYNC_V2_CLEANUP_SECRET is not set in the account-cleanup-production environment; the retention pass did not run."
            exit 1
          fi
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $ACCOUNT_SYNC_V2_CLEANUP_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://zodiacs.org/api/account/cleanup-receipts
