name: Checkpoint 23 source-bound Phase 1 captures
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: ['.github/workflows/checkpoint23-phase1-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPTURE_TARGET_SHA: '862e31e42aab89d7050b20f3be003edf7691ba48'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CAPTURE_TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the existing pinned browser
        run: npx playwright-core install --with-deps chromium
      - name: Build the exact target source with its footer step
        run: npm run build
      - name: Capture all nine templates at both required widths
        run: npm run test:phase1:acceptance
      - name: Verify the actual new captures and source receipt
        run: npm run test:phase1:evidence
      - name: Export actual PNGs, manifest and source binding
        run: |
          node --input-type=module <<'CAPTURE_EXPORT'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const head = spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8', shell: false });
          if (head.status !== 0 || head.stdout.trim() !== process.env.CAPTURE_TARGET_SHA) throw new Error('Capture checkout does not match target');
          const root = 'docs/acceptance/phase1/screenshots/';
          const manifestBytes = await readFile(root + 'manifest.json');
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          if (manifest.captures.length !== 18 || manifest.templateSourceSha256 !== 'c482bc1c785ceefcb3343b61b014fca5079c27d2f63034fde21ccc6aec0dccc7') throw new Error('Unexpected capture receipt');
          const files = ['manifest.json', ...manifest.captures.map(capture => capture.screenshot.file)];
          for (const name of files) {
            if (!/^(?:manifest\.json|[a-z-]+-(?:360|1280)\.png)$/.test(name)) throw new Error('Unexpected capture path');
            const bytes = await readFile(root + name);
            const capture = manifest.captures.find(row => row.screenshot.file === name);
            if (capture && hash(bytes) !== capture.screenshot.sha256) throw new Error('Captured PNG hash mismatch');
            console.log('PROGRAMME_FILE ' + JSON.stringify({ path: root + name, size: bytes.length,
              sha256: hash(bytes), base64: bytes.toString('base64') }));
          }
          const proof = {
            schema: 'zodiacs.checkpoint23-phase1-capture.v1',
            producer: { workflowSource: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, node: process.version },
            checkedOutSource: head.stdout.trim(), target: process.env.CAPTURE_TARGET_SHA,
            templateSourceSha256: manifest.templateSourceSha256, manifestSha256: hash(manifestBytes),
            captures: 18, browser: manifest.browser, capturedAt: manifest.capturedAt,
            limitation: 'Actual Phase 1 captures and receipt verification; not a full Site Check or performance result',
          };
          const content = JSON.stringify(proof, null, 2) + '\n';
          console.log('PROGRAMME_FILE ' + JSON.stringify({
            path: 'docs/platform/evidence/thesis-poster-loading-20261009/phase1-recapture-producer.json',
            size: Buffer.byteLength(content), sha256: hash(Buffer.from(content)),
            base64: Buffer.from(content).toString('base64'),
          }));
          
          CAPTURE_EXPORT
      - name: Unchanged visual comparisons after fresh captures
        run: npm run test:visual
      - name: Unchanged thirty-route Lighthouse budgets
        env:
          LIGHTHOUSE_SAVE_ASSETS: '1'
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint23-phase1-captures-${{ github.run_id }}
          path: |
            docs/acceptance/phase1/screenshots/
            tests/visual/artifacts/
          retention-days: 90
