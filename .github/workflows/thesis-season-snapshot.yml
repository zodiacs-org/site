name: Thesis season snapshot

# Fetches the raw per-sign Wikipedia pageviews behind the thesis season wheel
# and uploads them as an artifact for review. It never commits: a person reads
# the file and commits it with the reduced figure data.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/fetch-thesis-seasons.mjs
      - .github/workflows/thesis-season-snapshot.yml

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch per-sign pageviews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Fetch
        run: node scripts/fetch-thesis-seasons.mjs --out thesis-seasons-raw.json

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thesis-seasons-raw
          path: thesis-seasons-raw.json
          retention-days: 30
