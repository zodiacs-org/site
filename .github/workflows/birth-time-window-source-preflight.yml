name: Prepared birth-time UI source and type preflight
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/birth-time-window-source-preflight.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: '2507b7b22e53f9e466f6aa919db4f6b10a6eaf6c'
      QUALIFIED_MAIN: '41909a8294b29104f8b445f56e0cdd280379bcb9'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Source identity and original protected-scope guard
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --no-tags origin "$QUALIFIED_MAIN"
          node scripts/phase1-scope-guard.mjs --base "$QUALIFIED_MAIN"
      - run: npm ci
      - name: Parse prepared native harnesses
        run: |
          node --check tests/birth-time-window-drive.mjs
          node --check scripts/qualify-birth-time-window-visuals.mjs
          node --check scripts/retain-birth-time-window-capture-proof.mjs
      - name: Original source, type and focused ownership controls without a build or browser
        run: |
          npm run check
          npx vitest run src/lib/birth-time-window.test.ts src/islands/ChartCalculator.ownership.test.ts src/islands/ChartCalculator.confidence.test.ts
