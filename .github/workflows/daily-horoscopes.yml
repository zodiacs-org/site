name: Daily Sky

# At midnight UTC, compute one facts + copy + provenance package. GitHub may
# start scheduled jobs later, but the declared publication boundary is exact.
# Nothing is pushed until deterministic verification and a 30-day replay pass.

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
    # GitHub delays or drops busy-minute schedules: the entry above fired
    # at 08:54 on 2026-08-27 and not at all on 2026-08-28, leaving the
    # live site a day stale and every build red on the freshness gates
    # until a manual dispatch. The off-peak backstop below bounds that
    # damage; it is idempotent by construction — a fire that finds the
    # day's package already committed verifies production and exits (the
    # same design as the Registry Market Snapshot backstop). The declared
    # publication boundary stays 00:00 UTC.
    - cron: "23 4 * * *" # backstop if the midnight fire was dropped or drifted
  workflow_dispatch:

concurrency:
  # Serialize the publisher and its market-repair backstop on the same branch.
  group: daily-publication-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  daily:
    name: Compute today's sky
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A rerun is tied to the original event SHA. Resolve the current
          # default branch instead so a pushed-but-timed-out attempt becomes
          # an idempotent recovery run.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve explicit UTC target
        run: |
          echo "TARGET_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "VERIFIED_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compute today
        run: |
          node scripts/build-daily.mjs "$TARGET_DATE"
          npm run editorial:daily:build -- --date "$TARGET_DATE"
          npm run editorial:horoscopes:build -- --date "$TARGET_DATE"

      - name: Verify publication package
        run: |
          npm run editorial:daily:verify -- --date "$TARGET_DATE"
          npm run editorial:horoscopes:verify

      - name: Replay 30 publication days
        run: npm run editorial:daily:replay -- --through "$TARGET_DATE"

      # The site build refuses any tree whose Registry outlook is not dated
      # like daily.json (the pairing gate in scripts/registry-research-lib.mjs
      # runs inside `npm run build`), so a commit of the daily package alone
      # can never produce a deployable tree. The verify step below then waits
      # for a deployment that cannot exist, while the Registry Market Snapshot
      # workflow waits for this run to complete before repairing the pairing —
      # the nightly deadlock behind the "[Daily publication] Scheduled run
      # failed" incidents. Build the paired artifacts here so the single push
      # carries a buildable tree. Best effort on purpose: a market-data outage
      # must never block the consumer daily publication, so on any failure we
      # fall back to committing the daily package alone (the snapshot
      # workflow's backstop repairs the pairing later, exactly as before).
      - name: Pair the Registry outlook with today's edition (best effort)
        id: pairing
        continue-on-error: true
        run: |
          node scripts/daily-market-snapshot.mjs
          node scripts/build-registry-outlook.mjs
          node scripts/build-registry-research.mjs
          node scripts/build-sign-pages.mjs
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [history, outlook, researchDrafts, researchPublication, researchFeed] = await Promise.all([
            readFile('public/assets/data/registry-market-history.v1.json', 'utf8').then(JSON.parse),
            readFile('public/assets/registry-outlook.json', 'utf8').then(JSON.parse),
            readFile('src/data/registry-research/drafts.json', 'utf8').then(JSON.parse),
            readFile('src/data/registry-research/publication.json', 'utf8').then(JSON.parse),
            readFile('public/assets/registry-research-feed.json', 'utf8').then(JSON.parse),
          ]);
          const latest = history.snapshots?.at(-1);
          const dates = {
            market: latest?.date,
            marketRead: latest?.source?.readAt?.slice(0, 10),
            dailyOutlook: outlook.daily?.date,
            weeklyOutlook: outlook.weekly?.date,
            researchDrafts: researchDrafts.generatedAt?.slice(0, 10),
            researchPublication: researchPublication.generatedAt?.slice(0, 10),
            researchFeed: researchFeed.generatedAt?.slice(0, 10),
          };
          for (const [label, date] of Object.entries(dates)) {
            if (date !== process.env.TARGET_DATE) {
              throw new Error(`${label} artifact is ${date ?? 'undated'}; expected ${process.env.TARGET_DATE}`);
            }
          }
          NODE

      - name: Commit if changed
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAIRING_OUTCOME: ${{ steps.pairing.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(
            "src/data/daily.json"
            "src/data/daily-publication.json"
            "src/data/daily-publication-manifest.json"
            "src/data/horoscope-program.json"
          )
          REGISTRY_FILES=(
            "public/assets/data/registry-market-history.v1.json"
            "public/assets/registry-outlook.json"
            "src/data/registry-research/drafts.json"
            "src/data/registry-research/publication.json"
            "public/assets/registry-research-feed.json"
            "public/assets/data/registry-research"
            "public/registry"
          )
          if [ "$PAIRING_OUTCOME" = "success" ]; then
            FILES+=("${REGISTRY_FILES[@]}")
          else
            # Never commit a half-regenerated pairing; restore the verified
            # committed state and publish the daily package alone.
            echo "::warning title=Registry pairing skipped::Outlook pairing failed; committing the daily package alone. The Registry Market Snapshot backstop repairs the pairing later."
            git checkout -- "${REGISTRY_FILES[@]}" 2>/dev/null || true
            git clean -fdq -- "${REGISTRY_FILES[@]}" 2>/dev/null || true
          fi
          changed=false
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Daily publication package unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${FILES[@]}"
            git commit -m "Daily sky: $(node -p "require('./src/data/daily.json').date")"
            changed=true
          fi

          # Generated artifacts are valid only for the exact source revision
          # that passed the verifiers above. Never rebase them onto code that
          # those verifiers did not exercise; fail and rerun the whole job.
          git fetch origin "$DEFAULT_BRANCH"
          remote_sha=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if [ "$remote_sha" != "$VERIFIED_BASE_SHA" ]; then
            echo "Default branch advanced after verification; rerun the complete workflow" >&2
            exit 1
          fi
          # The protection rule on the default branch requires a pull request
          # (GH006 on a direct push). Try the direct push first — it stays the
          # fast path if a bypass actor is ever granted — and otherwise satisfy
          # the rule literally: publish the same verified commit through a
          # pull request the workflow opens and merges itself.
          if ! git push origin "HEAD:$DEFAULT_BRANCH" 2>"$RUNNER_TEMP/publish-push.err"; then
            cat "$RUNNER_TEMP/publish-push.err" >&2
            if grep -q "GH006" "$RUNNER_TEMP/publish-push.err"; then
              bash scripts/publish-through-pr.sh "$DEFAULT_BRANCH" "$VERIFIED_BASE_SHA" "$(git log -1 --format=%s)"
            else
              echo "Default branch advanced during publish; rerun the complete workflow" >&2
              exit 1
            fi
          fi

          git fetch origin "$DEFAULT_BRANCH"
          echo "committed=$changed" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse "origin/$DEFAULT_BRANCH")" >> "$GITHUB_OUTPUT"

      # This must run even when the package is unchanged. A retry after a push
      # may otherwise go green while the production deploy is still stale.
      - name: Require exact edition in production
        env:
          LIVE_DAILY_URL: https://zodiacs.org/data/daily-publication.json
        run: node scripts/verify-live-daily.mjs --url "$LIVE_DAILY_URL" --timeout 600

      # IndexNow accepts repeat submissions. Keeping this unconditional makes
      # a recovery run repair discovery after a prior network/deploy timeout.
      - name: Notify IndexNow
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';

          const keyFiles = (await readdir('public')).filter((name) => /^d21e17e6-.*\.txt$/.test(name));
          if (keyFiles.length !== 1) throw new Error(`Expected one IndexNow key file, found ${keyFiles.length}`);
          const keyFile = keyFiles[0];
          const key = (await readFile(`public/${keyFile}`, 'utf8')).trim();
          if (keyFile !== `${key}.txt`) throw new Error('IndexNow key filename and body do not match');

          const signs = ['aries', 'taurus', 'gemini', 'cancer', 'leo', 'virgo', 'libra', 'scorpio', 'sagittarius', 'capricorn', 'aquarius', 'pisces'];
          const paths = [
            '/', '/today/', '/horoscopes/',
            ...signs.flatMap((sign) => [
              `/horoscopes/${sign}/`,
              `/horoscopes/${sign}/tomorrow/`,
              `/horoscopes/${sign}/weekly/`,
              `/horoscopes/${sign}/monthly/`,
              `/horoscopes/${sign}/love/`,
              `/horoscopes/${sign}/career/`,
              `/horoscopes/${sign}/2027/`,
              `/feeds/horoscopes/${sign}.xml`,
            ]),
            '/transits/', '/feeds/', '/feeds/daily-sky.xml', '/feeds/horoscopes.xml',
          ];
          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'content-type': 'application/json; charset=utf-8' },
            signal: AbortSignal.timeout(15_000),
            body: JSON.stringify({
              host: 'zodiacs.org',
              key,
              keyLocation: `https://zodiacs.org/${keyFile}`,
              urlList: paths.map((path) => `https://zodiacs.org${path}`),
            }),
          });
          const body = await response.text();
          console.log(`IndexNow: ${response.status}${body ? ` — ${body}` : ''}`);
          if (![200, 202].includes(response.status)) process.exit(1);
          NODE

      - name: Write immutable operation receipt
        env:
          RECEIPT_PATH: ${{ runner.temp }}/daily-publication-${{ env.TARGET_DATE }}.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFile, readFile, writeFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile('src/data/daily-publication-manifest.json', 'utf8'));
          const horoscopeProgram = JSON.parse(await readFile('src/data/horoscope-program.json', 'utf8'));
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          };
          const canonicalSha256 = (value) => createHash('sha256')
            .update(JSON.stringify(canonical(value)))
            .digest('hex');
          const receipt = {
            schema: 'zodiacs.daily-operation-receipt.v2',
            targetDate: process.env.TARGET_DATE,
            event: process.env.EVENT_NAME,
            runId: Number(process.env.RUN_ID),
            runAttempt: Number(process.env.RUN_ATTEMPT),
            runUrl: process.env.RUN_URL,
            commitSha: process.env.COMMIT_SHA,
            publicationCanonicalSha256: manifest.publication.canonicalSha256,
            factsCanonicalSha256: manifest.facts.canonicalSha256,
            horoscopeProgramSha256: canonicalSha256(horoscopeProgram),
            liveVerification: 'exact-match',
            indexNow: 'accepted',
            completedAt: new Date().toISOString(),
          };
          await writeFile(process.env.RECEIPT_PATH, `${JSON.stringify(receipt, null, 2)}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            `## Daily publication ${receipt.targetDate}`,
            '',
            `- Trigger: \`${receipt.event}\``,
            `- Commit: \`${receipt.commitSha}\``,
            `- Publication hash: \`${receipt.publicationCanonicalSha256}\``,
            `- Horoscope program hash: \`${receipt.horoscopeProgramSha256}\``,
            '- Production: exact committed edition verified',
            '- IndexNow: accepted',
            '',
          ].join('\n'));
          NODE

      - name: Upload operation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-publication-${{ env.TARGET_DATE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-publication-${{ env.TARGET_DATE }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Close resolved daily-publication incident
        # Manual smoke tests must never claim that unattended publishing has
        # recovered; the incident lifecycle belongs only to scheduled runs.
        if: github.event_name == 'schedule' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list --state open --search '"[Daily publication] Scheduled run failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "Recovered on ${TARGET_DATE}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Record daily-publication incident
        if: github.event_name == 'schedule' && failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Daily publication] Scheduled run failed'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The ${TARGET_DATE:-unknown-date} publication did not complete. Run: ${run_url}"
          issue_number=$(gh issue list --state open --search '"[Daily publication] Scheduled run failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
