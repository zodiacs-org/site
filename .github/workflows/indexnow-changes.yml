name: IndexNow Changes

on:
  # Vercel repository dispatches are evaluated from the default-branch
  # workflow definition. Never use deployment_status here: that event can
  # evaluate workflow YAML from an untrusted deployed ref.
  #
  # Vercel moves the production domains to a production deployment before it
  # sends the ready event (for dpl_EWkFhE3xYWkw2wFx7o2DQtYqAwX1, 0.2 s after
  # the deployment was ready and 2 s before the event), so the live sitemap is
  # that deployment's; a run that still read the old one leaves the changes to
  # the next run. A promotion moves the domains without a build.
  repository_dispatch:
    types:
      - 'vercel.deployment.ready'
      - 'vercel.deployment.promoted'
  # Vercel sends no repository dispatch for an Instant Rollback (its Deployment
  # Promoted event leaves rollbacks out), and a dispatch can be lost. A run
  # every six hours compares the live sitemap with the last one submitted all
  # the same, so such a change is submitted within six hours.
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

# One run at a time, in order: each compares the live sitemap with the one
# the run before it submitted. A pending run that a newer one replaces loses
# nothing: the newer run submits every URL that differs from the last sitemap
# submitted, and a URL that came and went between them needs no notice.
concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  indexnow-changes:
    name: Submit new and changed URLs to IndexNow
    if: >-
      github.event_name == 'schedule' || (
      github.actor == 'vercel[bot]' &&
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.id == vars.VERCEL_PROJECT_ID &&
      github.event.client_payload.project.name == 'zodiacs-org')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Restore the sitemap last submitted
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow
          key: indexnow-sitemap-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-sitemap-v1-

      - name: Submit new, changed and removed URLs
        run: node scripts/indexnow-changed-urls.mjs --snapshot .indexnow/sitemap.json

      # Reached only when the submission succeeded, so a failed run leaves the
      # previous snapshot for the next one to compare with.
      - name: Record the sitemap submitted
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow
          key: indexnow-sitemap-v1-${{ github.run_id }}-${{ github.run_attempt }}
