name: Checkpoint 24 source and ledger controls
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: ['.github/workflows/checkpoint24-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IDENTITY_SOURCE: '5cdc38f4c0e6ae70bc0b69aec294d0046ad0b405'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.IDENTITY_SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unchanged protected-scope guard against the actual predecessor
        run: node scripts/phase1-scope-guard.mjs --base 50636624a8677da3644987cfa4fe735e811650f3
      - name: Identity tampering and original ledger controls
        run: npx vitest run scripts/organization-identity.test.mjs scripts/programme-ledger.test.mjs
      - name: Actual ledger rendering and validator syntax
        run: |
          node scripts/programme-ledger.mjs --check
          node --check scripts/validate-schema.mjs
      - name: Static page metadata and unchanged visible source
        run: |
          node --input-type=module <<'IDENTITY_CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {organizationIdentityErrors} from './scripts/organization-identity.mjs';
          import {readProgrammeLedger,figures} from './scripts/programme-ledger.mjs';
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8',shell:false}).trim();
          assert.equal(source,process.env.IDENTITY_SOURCE);
          const pages=[];
          for(const path of ['public/astrofolio/index.html','public/terminal/index.html','public/thesis/index.html']){
           const before=execFileSync('git',['show','50636624a8677da3644987cfa4fe735e811650f3:'+path],{encoding:'utf8',shell:false,maxBuffer:2*1024*1024});
           const after=readFileSync(path,'utf8');
           const expression=/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>[\s\S]*?<\/script>/g;
           assert.equal(after.replace(expression,''),before.replace(expression,''),'Nonmetadata bytes changed: '+path);
           const blocks=[...after.matchAll(expression)];
           assert.ok(blocks.length>0);
           for(const block of blocks){
            const schema=JSON.parse(block[0].slice(block[0].indexOf('>')+1,block[0].lastIndexOf('</script>')));
            const nodes=Array.isArray(schema)?schema:(schema['@graph']??[schema]);
            assert.deepEqual(organizationIdentityErrors(nodes),[]);
           }
           pages.push({path,bytes:Buffer.byteLength(after),sha256:hash(after),nonmetadataBytesPreserved:true,identityErrors:0});
          }
          const ledger=readProgrammeLedger();assert.equal(ledger.denominator.totalWeight,182.45);
          assert.equal(ledger.denominator.unitCount,151);
          assert.equal(ledger.denominator.digest,'52f0e08533e8774bf10d33a322b597f3205aea1a76980f6e2a8a6ba33fc1d0a8');
          const report={schema:'zodiacs.organization-source-check.v1',producer:{source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version},checkedOutSource:source,comparisonSource:'50636624a8677da3644987cfa4fe735e811650f3',pages,proposalFigures:figures(ledger),limitations:['Source and ledger tests only; no new capture, rendered-schema check, full suite or production claim.','Proposal figures are not accepted main progress.']};
          const output=JSON.stringify(report,null,2)+'\n',path='docs/platform/evidence/platform-identities-20261009/source-check.json';
          mkdirSync('docs/platform/evidence/platform-identities-20261009',{recursive:true});writeFileSync(path,output);
          console.log('PROGRAMME_FILE '+JSON.stringify({path,size:Buffer.byteLength(output),sha256:hash(output),base64:Buffer.from(output).toString('base64')}));
          
          IDENTITY_CHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint24-source-check
          path: docs/platform/evidence/platform-identities-20261009/source-check.json
          retention-days: 90
