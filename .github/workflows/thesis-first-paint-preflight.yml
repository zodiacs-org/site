name: Thesis first-paint source preflight
on:
  push:
    branches: ['codex/developer-docs-preparation']
    paths: ['.github/workflows/thesis-first-paint-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREFLIGHT_SOURCE: '6ba9ed02d7334bba66ebf30516727bc76cac04b8'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.PREFLIGHT_SOURCE }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate source
        run: test "$(git rev-parse HEAD)" = "$PREFLIGHT_SOURCE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Build candidate with unchanged source and dist checks
        run: npm run build
      - name: Existing thesis contracts and footer transform controls
        run: npx vitest run tests/thesis-contract.test.mjs scripts/inline-thesis-footer.test.mjs
      - name: Existing thesis browser acceptance
        run: npm run test:thesis:browser
      - name: Existing three-sample thesis performance gate
        env:
          LIGHTHOUSE_ROUTES: thesis
          LIGHTHOUSE_SAVE_ASSETS: '1'
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thesis-first-paint-preflight
          path: tests/visual/artifacts/
          retention-days: 90
