name: Checkpoint 24 source-bound captures and retained gate receipts
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: ['.github/workflows/checkpoint24-phase1-capture.yml']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPTURE_TARGET_SHA: '87583eff7e61973e2373ed1501007b2bcc1a4c54'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CAPTURE_TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Build exact metadata source with original source and dist checks
        run: npm run build
      - name: All nine templates at both required widths
        run: npm run test:phase1:acceptance
      - name: Original actual-capture receipt tests
        run: npm run test:phase1:evidence
      - name: Verify exact Git source and actual PNG identities
        run: |
          node --input-type=module <<'CAPTURE_EXPORT'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {relative} from 'node:path';
          import {phase1TemplateSourceSha256} from './tests/visual/phase1-evidence-contract.mjs';
          const root='docs/acceptance/phase1/screenshots/',hash=b=>createHash('sha256').update(b).digest('hex');
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8',shell:false}).trim();
          assert.equal(head,process.env.CAPTURE_TARGET_SHA);
          const bytes=await readFile(root+'manifest.json'),manifest=JSON.parse(bytes);
          assert.equal(manifest.captures.length,18);
          const rawHash=await phase1TemplateSourceSha256(process.cwd(),{readSource:absolute=>execFileSync('git',['show','HEAD:'+relative(process.cwd(),absolute).replaceAll('\\','/')],{shell:false,maxBuffer:12*1024*1024})});
          assert.equal(manifest.templateSourceSha256,rawHash);assert.equal(manifest.buildReceipt.templateSourceSha256,rawHash);
          assert.ok(Date.parse(manifest.capturedAt)>=Date.parse(manifest.buildReceipt.builtAt));
          const captures=[],names=new Set();
          for(const row of manifest.captures){
           const name=row.screenshot.file;assert.match(name,/^[a-z0-9-]+-(?:360|1280)\.png$/);
           assert.ok(!names.has(name));names.add(name);
           const actual=await readFile(root+name);assert.equal(hash(actual),row.screenshot.sha256);
           const previous=execFileSync('git',['show','HEAD:'+root+name],{shell:false,maxBuffer:12*1024*1024});
           captures.push({file:name,bytes:actual.length,sha256:hash(actual),previousTrackedBytes:previous.length,previousTrackedSha256:hash(previous),identicalToPreviousTracked:actual.equals(previous)});
          }
          const report={schema:'zodiacs.checkpoint24-phase1-capture.v1',producer:{workflowSource:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version},checkedOutSource:head,target:process.env.CAPTURE_TARGET_SHA,rawGitTemplateSourceSha256:rawHash,manifestSha256:hash(bytes),captures,browser:manifest.browser,capturedAt:manifest.capturedAt,builtAt:manifest.buildReceipt.builtAt,limitation:'Eighteen fresh actual captures and original receipt tests; full combined suite and production checks remain required.'};
          function exported(path,b){console.log('PROGRAMME_FILE '+JSON.stringify({path,size:b.length,sha256:hash(b),base64:b.toString('base64')}));}
          exported(root+'manifest.json',bytes);
          const proof=Buffer.from(JSON.stringify(report,null,2)+'\n');await writeFile('checkpoint24-capture-producer.json',proof);
          exported('docs/platform/evidence/platform-identities-20261009/phase1-capture-producer.json',proof);
          console.log('PROGRAMME_CAPTURE_SUMMARY '+JSON.stringify({actual:18,identical:captures.filter(x=>x.identicalToPreviousTracked).length,differing:captures.filter(x=>!x.identicalToPreviousTracked).map(x=>x.file)}));
          
          CAPTURE_EXPORT
      - name: Read actual rendered FAQ inventory for semantic review
        run: |
          node --input-type=module <<'FAQ_INVENTORY'
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8',shell:false}).trim();
          if(source!==process.env.CAPTURE_TARGET_SHA)throw Error('FAQ inventory source mismatch');
          const files=execFileSync('rg',['--files','dist','-g','index.html'],{encoding:'utf8',shell:false,maxBuffer:8*1024*1024}).trim().split('\n').sort();
          const plain=v=>String(v).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          const types=n=>Array.isArray(n?.['@type'])?n['@type']:[n?.['@type']].filter(Boolean);
          const records=[];
          for(const path of files){
           const bytes=readFileSync(path),html=bytes.toString('utf8'),faqs=[],top=[];
           for(const m of html.matchAll(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)){
            const doc=JSON.parse(m[1]);top.push(...(Array.isArray(doc)?doc:(doc['@graph']??[doc])));
            function visit(v){if(!v||typeof v!=='object')return;if(types(v).includes('FAQPage'))faqs.push(v);for(const c of Object.values(v))if(c&&typeof c==='object')visit(c);}visit(doc);
           }
           if(!faqs.length)continue;
           const canonical=html.match(/<link\b[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)["']/i)?.[1];
           records.push({path:canonical?new URL(canonical).pathname:'/'+path.slice(5,-10),sourceFile:path,bytes:bytes.length,sha256:hash(bytes),h1:plain(html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i)?.[1]??'').slice(0,180),primaryTypes:[...new Set(top.flatMap(types).filter(t=>['WebSite','WebPage','WebApplication','Article','CollectionPage'].includes(t)))].sort(),faqNodes:faqs.length,questions:faqs.reduce((n,f)=>n+(Array.isArray(f.mainEntity)?f.mainEntity.length:0),0)});
          }
          const report={schema:'zodiacs.rendered-faq-inventory.v1',producer:{workflowSource:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version},checkedOutSource:source,htmlDocuments:files.length,faqDocuments:records.length,records,limitations:['Index.html markup inventory only; other document/response types not covered.','Primary purpose and computed visibility require review.','No automatic removal or accepted S2 weight.']};
          const output=JSON.stringify(report,null,2)+'\n',path='docs/platform/evidence/faq-audit-20261009/rendered-inventory.json';
          mkdirSync('docs/platform/evidence/faq-audit-20261009',{recursive:true});writeFileSync(path,output);
          console.log('PROGRAMME_FILE '+JSON.stringify({path,size:Buffer.byteLength(output),sha256:hash(output),base64:Buffer.from(output).toString('base64')}));
          
          FAQ_INVENTORY
      - name: Verify original passing full-suite artifact and retain exact thesis metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'RETAINED_METRICS'
          import base64, hashlib, io, json, os, urllib.parse, urllib.request, zipfile
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, url):
                  result=super().redirect_request(req,fp,code,msg,headers,url)
                  if result is not None and urllib.parse.urlsplit(url).hostname!='api.github.com':result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(Redirect())
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/zodiacs-org/site'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with opener.open(req,timeout=60) as response:data=response.read(200000001)
              assert len(data)<=200000000
              return data
          run=json.loads(get('/actions/runs/37962304681'))
          assert run['head_sha']=='50636624a8677da3644987cfa4fe735e811650f3' and run['conclusion']=='success'
          archive=get('/actions/artifacts/11634551439/zip')
          assert hashlib.sha256(archive).hexdigest()=='d7b777abb513f7e37df7c303a588c479cf6891b4edc6dbf424c44098e2029681'
          samples=[]
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names=sorted(n for n in z.namelist() if 'lighthouse/' in n and n.endswith(('/thesis-1.json','/thesis-2.json','/thesis-3.json')))
              assert len(names)==3,names
              for name in names:
                  data=z.read(name);lhr=json.loads(data);audits=lhr['audits']
                  row={'file':name,'sha256':hashlib.sha256(data).hexdigest(),'lcpMs':audits['largest-contentful-paint']['numericValue'],'cls':audits['cumulative-layout-shift']['numericValue'],'tbtMs':audits['total-blocking-time']['numericValue'],'performance':lhr['categories']['performance']['score'],'accessibility':lhr['categories']['accessibility']['score'],'seo':lhr['categories']['seo']['score']}
                  assert row['lcpMs']<=2500 and row['cls']==0 and row['tbtMs']<=200
                  samples.append(row)
          report={'schema':'zodiacs.thesis-full-suite-receipt.v1','producer':{'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID']},'testedHead':'50636624a8677da3644987cfa4fe735e811650f3','integration':'45fc46b25fd96a17ae6029820f8382d623e7bdad','tree':'7d8126fc00dea60caebaf85540e2919c90dab72a','originalRun':37962304681,'artifact':11634551439,'artifactSha256':hashlib.sha256(archive).hexdigest(),'jobsPassed':20,'lighthouseRoutesPassed':30,'stalls':0,'retakes':0,'samples':samples,'limitations':['Read-only extraction from the original passing full suite; no new browser run or gate relaxation.']}
          data=(json.dumps(report,indent=2)+'\n').encode()
          path='docs/platform/evidence/thesis-poster-loading-20261009/fixed-rail-full-suite.json'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,'wb') as out:out.write(data)
          print('PROGRAMME_FILE '+json.dumps({'path':path,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'base64':base64.b64encode(data).decode()},separators=(',',':')))
          
          RETAINED_METRICS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint24-phase1-captures-${{ github.run_id }}
          path: |
            docs/acceptance/phase1/screenshots/
            checkpoint24-capture-producer.json
            docs/platform/evidence/faq-audit-20261009/rendered-inventory.json
            docs/platform/evidence/thesis-poster-loading-20261009/fixed-rail-full-suite.json
          retention-days: 90
