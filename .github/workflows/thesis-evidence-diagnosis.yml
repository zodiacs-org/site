name: Retained thesis performance diagnosis
on:
  push:
    branches: ['codex/developer-docs-preparation']
    paths:
      - 'scripts/diagnose-retained-thesis-evidence.py'
      - '.github/workflows/thesis-evidence-diagnosis.yml'
permissions:
  contents: read
  actions: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect already-retained thesis reports and traces without a gate rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose-retained-thesis-evidence.py
