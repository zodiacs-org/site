name: Observe public adoption baselines without build or engine execution
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/public-adoption-baseline.yml]
permissions:
  contents: read
jobs:
  public-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retain actual public response bytes and explicit missing measures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PUBLIC_OBSERVATION'
          import os,json,hashlib,base64,urllib.request,urllib.error,urllib.parse,datetime,re
          from concurrent.futures import ThreadPoolExecutor
          out='docs/platform/evidence/public-adoption-baseline-20261010/'
          targets=[
           ('npm-engine-week','https://api.npmjs.org/downloads/point/last-week/%40zodiacs%2Fengine'),
           ('npm-mcp-week','https://api.npmjs.org/downloads/point/last-week/%40zodiacs%2Fmcp-server'),
           ('pypistats-python-recent','https://pypistats.org/api/packages/zodiacs/recent'),
           ('github-engine','https://api.github.com/repos/zodiacs-org/engine'),
           ('github-site','https://api.github.com/repos/zodiacs-org/site'),
           ('github-engine-dependents','https://github.com/zodiacs-org/engine/network/dependents'),
           ('mcp-registry-search','https://registry.modelcontextprotocol.io/v0.1/servers?search=zodiacs&limit=100&version=latest')]
          def emit(path,data):
           print('PROGRAMME_FILE '+json.dumps({'path':path,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'base64':base64.b64encode(data).decode()},separators=(',',':')),flush=True)
          def get(target):
           name,url=target;headers={'User-Agent':'zodiacs-programme-public-baseline/1','Accept':'application/json' if name!='github-engine-dependents' else 'text/html'}
           authenticated=False
           if url.startswith('https://api.github.com/'):
            headers['Authorization']='Bearer '+os.environ['GITHUB_TOKEN'];authenticated=True
           start=datetime.datetime.now(datetime.timezone.utc).isoformat()
           try:
            response=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30)
           except urllib.error.HTTPError as error:response=error
           except Exception as error:return {'name':name,'url':url,'observedAt':start,'status':'unavailable','error':type(error).__name__,'authenticatedGitHubMetadata':authenticated},None
           with response:
            data=response.read(4000001)
            assert len(data)<=4000000,(name,'response too large')
            code=response.code;final=response.url;content_type=response.headers.get('Content-Type')
           row={'name':name,'url':url,'finalUrl':final,'observedAt':start,'httpStatus':code,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'contentType':content_type,'authenticatedGitHubMetadata':authenticated}
           if code==200:
            try:doc=json.loads(data)
            except (ValueError,UnicodeDecodeError):doc=None
            if name.startswith('npm-') and isinstance(doc,dict) and 'downloads' in doc:
             assert isinstance(doc['downloads'],int) and doc['downloads']>=0
             row['measurement']={'downloads':doc['downloads'],'periodStart':doc['start'],'periodEnd':doc['end'],'package':doc['package'],'method':'npm downloads point API last-week; downloads, not unique people or external adopters'}
            elif name=='pypistats-python-recent' and isinstance(doc,dict):
             row['measurement']={'provider':'pypistats.org (third-party PyPI statistics)','data':doc.get('data'),'type':doc.get('type'),'package':doc.get('package'),'method':'PyPIStats recent API; provider-defined last-day/week/month windows; not unique users'}
            elif name in ('github-engine','github-site') and isinstance(doc,dict):
             assert doc['private'] is False
             row['measurement']={'repository':doc['full_name'],'stars':doc['stargazers_count'],'forks':doc['forks_count'],'subscribers':doc['subscribers_count'],'defaultBranch':doc['default_branch'],'method':'Authenticated GitHub REST observation of public repository metadata; no code checkout'}
            elif name=='github-engine-dependents':
             text=data.decode('utf-8')
             counts=re.findall(r'([0-9][0-9,]*)\s*</[^>]+>\s*(?:Repositories|Packages)',text,re.I)
             row['measurement']={'status':'unparsed','method':'Anonymous GitHub public dependents HTML retained for review; no count inferred from missing elements','candidateCountStrings':counts}
            elif name=='mcp-registry-search' and isinstance(doc,dict):
             row['measurement']={'status':'requires-review','serversReturned':len(doc.get('servers',[])) if isinstance(doc.get('servers'),list) else None,'metadata':doc.get('metadata'),'method':'Official metadata registry search for zodiacs; listings are not installs or sessions'}
           else:
            row['measurement']={'status':'unavailable','method':'Non-200 response is retained; no zero inferred'}
           suffix='.html' if name=='github-engine-dependents' else '.json'
           row['rawPath']=out+name+suffix
           return row,data
          with ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(get,targets))
          rows=[]
          for row,data in results:
           rows.append(row)
           if data is not None:emit(row['rawPath'],data)
          report={'schema':'zodiacs.public-adoption-baseline-observation.v1','producer':{'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'python':os.sys.version.split()[0]},'observations':rows,'coverage':'partial','limitations':['Read-only public network observations with exact raw response identities; no build, browser, publication, private account or engine execution.','Unknown, blocked, unparsed and non-200 values are not zero.','Registry searches need pagination and identity review; dependent counts need HTML review; citing-domain discovery needs separate checked sources.','Registry downloads include CI and repeat downloads and are not unique external adoption. PyPIStats is a third-party provider.','Remote MCP sessions and hosted API caller counts need owner-controlled telemetry; no such private data was accessed.','P0.7a is not accepted by this collection alone.']}
          emit(out+'observation.json',(json.dumps(report,indent=2)+'\n').encode())
          
          PUBLIC_OBSERVATION
