name: Acquire independent solar-term reference source
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/solar-term-reference-acquisition.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Acquire four bounded anonymous source responses
        run: node scripts/solar-term-reference-acquisition.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solar-term-reference-source
          path: docs/platform/evidence/solar-term-reference-20261010/
