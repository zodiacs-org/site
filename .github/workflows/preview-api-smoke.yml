name: Preview API Smoke

on:
  # Vercel repository dispatches are evaluated from the default-branch
  # workflow definition. Never use deployment_status here: that event can
  # evaluate workflow YAML from an untrusted deployed ref.
  repository_dispatch:
    types:
      - 'vercel.deployment.ready'

permissions:
  contents: read

concurrency:
  group: preview-api-smoke-${{ github.event.client_payload.id }}
  cancel-in-progress: true

jobs:
  preview-api-smoke:
    name: Preview API smoke
    if: >-
      github.actor == 'vercel[bot]' &&
      github.event.client_payload.environment == 'preview' &&
      github.event.client_payload.project.id == vars.VERCEL_PROJECT_ID &&
      github.event.client_payload.project.name == 'zodiacs-org'
    runs-on: ubuntu-latest
    environment: preview-smoke-production
    timeout-minutes: 10
    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Probe the Preview functions
        env:
          PREVIEW_URL: ${{ github.event.client_payload.url }}
          DEPLOYMENT_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Optional for public previews; required when Vercel Deployment
          # Protection intercepts automation before it reaches the app.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-preview-functions.mjs
