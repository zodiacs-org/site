name: Retained Aries visual diagnosis
on:
  push:
    branches: ['codex/developer-docs-preparation']
    paths:
      - 'scripts/diagnose-retained-aries-visual.py'
      - '.github/workflows/aries-visual-diagnosis.yml'
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Read and compare preserved failing screenshots without browser recapture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose-retained-aries-visual.py
