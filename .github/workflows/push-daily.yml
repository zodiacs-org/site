name: Daily Push

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render without sending"
        required: false
        type: boolean
        default: true
      limit:
        description: "Maximum subscriptions for this run"
        required: false
        type: string
        default: "500"

permissions:
  contents: read

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    name: Send daily push
    runs-on: ubuntu-latest
    environment: daily-push-production
    timeout-minutes: 25
    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke event and quiet-day dry runs
        run: |
          npm run push:daily -- --dry-run --fixture --date 2026-07-18 --limit 1
          npm run push:daily -- --dry-run --fixture --date 2026-07-22 --limit 1

      - name: Require the verified events publication
        run: npm run data:events:verify

      - name: Require selected event in production before real delivery
        if: (github.event_name == 'schedule' && vars.PUSH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: npm run push:daily -- --verify-live-only

      # Scheduled sends remain off until the owner completes the VAPID and
      # Supabase setup. A protected-main manual dispatch always reaches this
      # step and defaults to a dry run.
      - name: Run daily push
        if: github.event_name != 'schedule' || vars.PUSH_ENABLED == 'true'
        env:
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
          PUSH_TEST_SUBSCRIPTION_IDS: ${{ vars.PUSH_TEST_SUBSCRIPTION_IDS }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:hello@zodiacs.org' }}
          PUSH_DRY_RUN: ${{ inputs.dry_run }}
          PUSH_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=(--limit "${PUSH_LIMIT:-500}")
          if [ "${PUSH_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          npm run push:daily -- "${ARGS[@]}"
