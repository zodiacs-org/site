name: Motion captures (scratch, not for merge)
on:
  push:
    branches: [claude/motion-captures]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy the earlier capture artifact onto a scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run download 44131071114 -R "$REPO" -n browser-evidence-candidates-9a5ad3c21741d885604acfb7e43d143aecebb758-44131071114 -D out
          cd out
          git init -q -b claude/motion-captures-out
          git -c user.name="Zodiacs Admin" -c user.email=admin@zodiacs.org add -A
          git -c user.name="Zodiacs Admin" -c user.email=admin@zodiacs.org commit -qm "Scratch: phase 1 evidence candidates (not for merge)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:claude/motion-evidence-out
