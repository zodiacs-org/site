name: Read-only programme receipts and official protocol observations
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: ['.github/workflows/checkpoint24-protocol-observation.yml']
permissions:
  contents: read
  actions: read
jobs:
  retained_metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify original passing full-suite artifact and retain exact thesis metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'RETAINED_METRICS'
          import base64, hashlib, io, json, os, urllib.parse, urllib.request, zipfile
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, url):
                  result=super().redirect_request(req,fp,code,msg,headers,url)
                  if result is not None and urllib.parse.urlsplit(url).hostname!='api.github.com':result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(Redirect())
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/zodiacs-org/site'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with opener.open(req,timeout=60) as response:data=response.read(200000001)
              assert len(data)<=200000000
              return data
          run=json.loads(get('/actions/runs/37962304681'))
          assert run['head_sha']=='50636624a8677da3644987cfa4fe735e811650f3' and run['conclusion']=='success'
          archive=get('/actions/artifacts/11634551439/zip')
          assert hashlib.sha256(archive).hexdigest()=='d7b777abb513f7e37df7c303a588c479cf6891b4edc6dbf424c44098e2029681'
          samples=[]
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names=sorted(n for n in z.namelist() if 'lighthouse/' in n and n.endswith(('/thesis-1.json','/thesis-2.json','/thesis-3.json')))
              assert len(names)==3,names
              for name in names:
                  data=z.read(name);lhr=json.loads(data);audits=lhr['audits']
                  row={'file':name,'sha256':hashlib.sha256(data).hexdigest(),'lcpMs':audits['largest-contentful-paint']['numericValue'],'cls':audits['cumulative-layout-shift']['numericValue'],'tbtMs':audits['total-blocking-time']['numericValue'],'performance':lhr['categories']['performance']['score'],'accessibility':lhr['categories']['accessibility']['score'],'seo':lhr['categories']['seo']['score']}
                  assert row['lcpMs']<=2500 and row['cls']==0 and row['tbtMs']<=200
                  samples.append(row)
          report={'schema':'zodiacs.thesis-full-suite-receipt.v1','producer':{'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID']},'testedHead':'50636624a8677da3644987cfa4fe735e811650f3','integration':'45fc46b25fd96a17ae6029820f8382d623e7bdad','tree':'7d8126fc00dea60caebaf85540e2919c90dab72a','originalRun':37962304681,'artifact':11634551439,'artifactSha256':hashlib.sha256(archive).hexdigest(),'jobsPassed':20,'lighthouseRoutesPassed':30,'stalls':0,'retakes':0,'samples':samples,'limitations':['Read-only extraction from the original passing full suite; no new browser run or gate relaxation.']}
          data=(json.dumps(report,indent=2)+'\n').encode()
          path='docs/platform/evidence/thesis-poster-loading-20261009/fixed-rail-full-suite.json'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,'wb') as out:out.write(data)
          print('PROGRAMME_FILE '+json.dumps({'path':path,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'base64':base64.b64encode(data).decode()},separators=(',',':')))
          
          RETAINED_METRICS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint23-retained-metrics-${{ github.run_id }}
          path: docs/platform/evidence/thesis-poster-loading-20261009/fixed-rail-full-suite.json
          retention-days: 90
  protocol_observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Two unmodified official scenarios with isolated locked dependencies
        run: node scripts/remote-mcp-official-observation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-mcp-official-scenarios-${{ github.run_id }}
          path: |
            docs/platform/evidence/remote-mcp-conformance-20261009/official-scenarios.json
            protocol-observation-results/
          retention-days: 90
