name: Site Check

on:
  push:
    branches:
      - main
  # Stacked packet PRs target the preceding packet branch, so every PR base
  # must receive the same regression gates as main.
  pull_request:
  workflow_dispatch:
    inputs:
      scope_base:
        description: Commit SHA or ref to compare for the protected-scope guard
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR checks can stop; production checks finish normally.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-check:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Phase 1 protected-scope guard
        env:
          PHASE1_SCOPE_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_base || github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:phase1:scope

      - name: Install
        run: npm ci

      - name: Dependency advisories stay at zero
        # Production tree must be clean at any severity; the full tree
        # (dev included) fails only on high/critical so a low-severity
        # transitive dev advisory cannot block an unrelated deploy.
        # Retry only recognized, findings-free audit endpoint outages;
        # every other failure and exhausted retries remain fatal.
        run: |
          node scripts/audit-with-retry.mjs --omit=dev
          node scripts/audit-with-retry.mjs --audit-level=high

      - name: Install pinned Chromium
        run: npx playwright-core install chromium

      - name: Validate registry JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('public/registry/zodiacs.registry.json', 'utf8'))"

      - name: Check for stale repo or bridge wording
        run: |
          ! grep -RInE 'Symbiosis|ZodiacS(DK)|diasmal[[:digit:]]{3}|github\.com/ZodiacsOfficial' public/sdk public/registry README.md CLAUDE.md DESIGNER_HANDOFF.md

      - name: Wing language stays in the wing
        # The source-aware gate checks rendered strings across Astro, TS/TSX,
        # MDX, JSON, email/share code, and API output. Legal and Registry
        # carve-outs are exact and tested; arbitrary directory bypasses are not.
        run: npm run check:consumer-boundary

      - name: Voice — banned tells stay out of the copy
        # The smug vocabulary CLAUDE.md bans on new surfaces, enforced
        # over every content file and template the agents touch.
        run: |
          ! grep -RIniE 'done properly|computed properly|shows? (its|their) work|like a human( wrote it)?|no mush|not vibes|speaks human|in plain language|como es debido|sin paja' src/content src/pages src/components src/islands

      - name: Authorship stays transparent
        run: |
          ! grep -RInE 'Rowan Vale|about/#editor([^i]|$)|"@type"[[:space:]]*:[[:space:]]*"Person"' src

      # npm's prebuild already verifies the package and replays 30 editions.
      # Keep that release gate, without running it twice in this same job.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run check

      - name: Thesis reading and evidence at six viewport widths
        run: OUT_DIR=tests/visual/artifacts/thesis npm run test:thesis:browser

      - name: Upload thesis screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thesis-browser-${{ github.run_id }}
          path: tests/visual/artifacts/thesis/
          if-no-files-found: ignore
          retention-days: 30

      - name: Birth chart export and sharing acceptance
        env:
          T17_SHARE_EVIDENCE: "1"
        run: node tests/t17-positions-share.mjs

      - name: Imported calendar input boundaries
        run: node tests/platform-share-boundary-drive.mjs

      - name: Moon lookup result ownership
        timeout-minutes: 3
        run: OUT_DIR=tests/visual/artifacts/moon-result-ownership node tests/moon-result-ownership-drive.mjs

      - name: Birth chart result ownership
        timeout-minutes: 5
        run: OUT_DIR=tests/visual/artifacts/chart-ownership node tests/chart-ownership-drive.mjs

      - name: Chart-linked prompt result ownership
        timeout-minutes: 5
        run: OUT_DIR=tests/visual/artifacts/post-chart-context-clear node tests/post-chart-context-clear-drive.mjs

      - name: Native complete local-date coverage
        timeout-minutes: 3
        run: OUT_DIR=tests/visual/artifacts/local-date-intervals node tests/local-date-intervals-drive.mjs

      - name: Unknown-time local date reference
        timeout-minutes: 5
        run: OUT_DIR=tests/visual/artifacts/local-date-reference node tests/local-date-reference-drive.mjs

      - name: Unknown-time chart confidence
        timeout-minutes: 5
        run: OUT_DIR=tests/visual/artifacts/chart-reference-confidence node tests/chart-reference-confidence-drive.mjs

      - name: Current reference captions
        timeout-minutes: 5
        run: OUT_DIR=tests/visual/artifacts/reference-captions node tests/reference-caption-drive.mjs

      - name: Inactive saved receipt storage and durable erasure
        timeout-minutes: 3
        run: OUT_DIR=tests/visual/artifacts/saved-natal-storage node tests/saved-natal-storage-drive.mjs

      - name: Engine accuracy vectors
        run: npm test

      # The precision alpha's own suite is node:test, not vitest, so the
      # line above does not reach it -- and it is where the aliasing
      # counterexamples, the proven-completeness cases and the result
      # contract's invariants live. A test nothing runs is not a test.
      # Environment-neutral: no pack, no kernel, no network.
      - name: Precision alpha tier A
        working-directory: examples/precision-alpha
        run: npm test

      - name: Platform starter fresh consumer
        timeout-minutes: 6
        run: node scripts/verify-platform-starter.mjs --install

      - name: Phase 1 exact-width acceptance evidence
        run: npm run test:phase1:evidence

      - name: Weekly digest smoke
        run: npm run digest:weekly -- --dry-run --fixture --week-start 2026-07-13 --limit 1

      - name: Link & artifact integrity over dist
        run: node scripts/check-dist.mjs

      - name: I18n route-boundary regression
        run: npm run test:i18n:r0

      - name: Russian R2 public-locale acceptance
        run: OUT_DIR=tests/visual/artifacts/i18n-r2-ru npm run test:i18n:r2

      - name: Homepage poster motion and deferred video
        run: OUT_DIR=tests/visual/artifacts/home-hero npm run test:home-hero:browser

      - name: Homepage interactive chart preview
        run: npm run test:home-demo:browser

      - name: Phase 2 sky-events publication drive
        run: OUT_DIR=tests/visual/artifacts/events npm run test:events:browser

      - name: Phase 5 People noindex pilot
        run: OUT_DIR=tests/visual/artifacts/phase5-people npm run test:phase5:people

      - name: Phase 6 Ask Zodiacs drive
        run: npm run test:phase6:ask

      - name: Today SSR and personalization
        run: npm run test:today:browser

      - name: Horoscope templates, SSR, and responsive behavior
        run: OUT_DIR=tests/visual/artifacts/horoscope-program npm run test:horoscopes:browser

      - name: Link-in-bio page acceptance
        run: OUT_DIR=tests/visual/artifacts/bio npm run test:bio:browser

      - name: Existing compatibility regression drive
        run: OUT_DIR=tests/visual/artifacts/compatibility npm run test:compatibility:browser

      - name: Existing Registry selector regression drive
        run: OUT_DIR=tests/visual/artifacts/registry npm run test:registry-selector:browser

      - name: Zodiac Markets mobile terminal acceptance
        run: OUT_DIR=tests/visual/artifacts/zodiac-markets node tests/registry-exchange-mobile-drive.mjs

      - name: Phase 1 mobile frame cadence
        run: npm run test:phase1:frames

      - name: Structured data validation
        run: npm run schema:check

      - name: Bundle size & engine isolation gates
        run: node scripts/report-bundles.mjs --fail

      - name: Visual regression
        run: npm run test:visual

      - name: Lighthouse performance budgets
        run: npm run test:lighthouse

      - name: Foreign-origin widget integration
        run: npm run test:widgets:browser

      - name: Widget Lighthouse thresholds
        run: npm run test:widgets:lighthouse

      - name: Upload Phase 1 browser and performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-1-browser-performance-${{ github.run_id }}
          path: |
            tests/visual/artifacts/
            docs/acceptance/phase4-sharing/chart-sheet-33-percent.png
          if-no-files-found: ignore
          retention-days: 90

  legacy-drift:
    name: Legacy wing drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify Registry hub generated output
        run: npm run registry:hub:check

      # Committed wing HTML must match what the builders produce from
      # sources (build-app resolves the pinned local @babel/standalone,
      # so this job runs fully offline).
      - name: Rebuild wing output from sources
        run: |
          node scripts/build-app.mjs
          node scripts/build-registry-token-chart.mjs
          node scripts/build-sign-pages.mjs
          node scripts/build-archive.mjs
          node scripts/build-shelf.mjs
          node scripts/build-trade.mjs
          node scripts/build-exchange.mjs
          node scripts/configure-registry-exchange.mjs
          node scripts/build-precision-preview.mjs

      - name: Drift gate
        run: git diff --exit-code -- public/

  phase3-delivery-sql:
    name: Phase 3 delivery SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: PostgreSQL 17 migration and concurrency gates
        run: bash scripts/test-phase3-delivery-sql.sh

  phase4-compat-invites-sql:
    name: Phase 4 compatibility invite SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: PostgreSQL 17 migration, privacy, and concurrency gates
        run: bash scripts/test-phase4-compat-invites-sql.sh

  phase6-assistant-sql:
    name: Phase 6 assistant quota SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: PostgreSQL 17 migration, privacy, and concurrency gates
        run: bash scripts/test-phase6-assistant-sql.sh

  account-sync-v2-sql:
    name: Account Sync v2 SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: PostgreSQL 17 migration, privacy, and concurrency gates
        run: bash scripts/test-account-sync-v2-sql.sh

  phase7-living-chart-sync-sql:
    name: Phase 7 Living Chart sync SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: PostgreSQL 17 migration, RLS, replay, and concurrency gates
        run: bash scripts/test-living-chart-sync-sql.sh

  phase7-living-chart-drive:
    name: Phase 7 Living Chart drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_LIVING_CHART_CAPTURE_ENABLED: "1"
      PUBLIC_LIVING_CHART_SYNC_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Build (Living Chart capture flag on)
        run: npm run build

      - name: Local save, persistence, export, and deletion acceptance
        run: npm run test:phase7:living-chart

  saved-records-lifecycle-drive:
    name: Saved calculation records lifecycle drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SAVED_RECORDS_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Build (saved calculation records flag on)
        run: npm run build

      # The flag-on build is the configuration activation ships. It must pass the
      # same integrity gates as the flag-off build, or a records-only regression
      # reaches production with CI fully green.
      - name: Consumer boundary, footer and type checks (flag on)
        run: npm run check

      - name: Link and artifact integrity over dist (flag on)
        run: node scripts/check-dist.mjs

      - name: Bundle size and engine isolation gates (flag on)
        run: node scripts/report-bundles.mjs --fail

      - name: Explicit keep, inventory, exact export, deletion, recovery and readmission acceptance
        run: OUT_DIR=tests/visual/artifacts/saved-records-lifecycle npm run test:saved-records:browser

      - name: Flag rollback gates (off, on, off, on with one browser profile)
        run: OUT_DIR=tests/visual/artifacts/saved-records-rollback npm run test:saved-records:rollback

      - name: Upload saved-records lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saved-records-lifecycle-${{ github.run_id }}
          path: tests/visual/artifacts/saved-records-lifecycle/
          if-no-files-found: ignore
          retention-days: 30

  saved-records-account-drive:
    name: Saved calculation records under the real account coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      # Fixture-only build: the records flag, the account coordinator and a
      # synthetic auth origin the drive answers. Never a real project; the
      # builder sets the flags itself (tests/saved-records-account.mjs).
      - name: Fixture build, then the real bootstrap and account panel journeys with intercepted auth and backend
        run: OUT_DIR=tests/visual/artifacts/saved-records-account npm run test:saved-records:account

      - name: Upload saved-records account evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saved-records-account-${{ github.run_id }}
          path: tests/visual/artifacts/saved-records-account/
          if-no-files-found: ignore
          retention-days: 30

  zodiac-games-sql:
    name: Zodiac Games SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: PostgreSQL 17 migration, privacy, and concurrency gates
        run: bash scripts/test-games-sql.sh

  phase4-sharing-drive:
    name: Phase 4 sharing drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Feature-off and fixture-enabled browser acceptance
        run: npm run test:phase4:sharing

  phase3-post-chart-drive:
    name: Phase 3 post-chart drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Browser acceptance drive
        run: npm run test:phase3:post-chart

  phase3-push-drive:
    name: Phase 3 push drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_WEB_PUSH_ENABLED: "1"
      PUSH_ENABLED: "1"
      PUBLIC_VAPID_KEY: AQIDBA
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Build (push flags on, fixture key only)
        run: npm run build

      - name: Today returning layout (push flags on)
        run: npm run test:today:browser

      - name: Browser acceptance drive
        run: npm run test:phase3:push

  phase3-pwa-drive:
    name: Phase 3 PWA drive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Build
        run: npm run build

      - name: Browser acceptance drive
        run: npm run test:phase3:pwa

  aura-drive:
    # The flag-on browser acceptance suite for Registry Aura: docket honesty,
    # Alignment grammar, share privacy, wallet lifecycle, forced colors, and
    # the offline/error escapes. The holdings endpoint is mocked in-page, so
    # the RPC URLs only need to satisfy build-time validation.
    name: Registry Aura drive
    runs-on: ubuntu-latest
    env:
      PUBLIC_REGISTRY_COLLECTION_ENABLED: "1"
      SOLANA_RPC_URL: https://aura-ci.invalid/rpc
      BASE_RPC_URL: https://aura-ci.invalid/base
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Build (feature flag on)
        run: npm run build

      - name: Browser acceptance drive
        run: npm run test:aura:browser

      - name: Upload regenerated proofs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aura-drive-proofs
          path: docs/acceptance/registry-aura/
          if-no-files-found: ignore

  # Production builds with all of these public flags on. The other builds
  # here turn on one flag or none, and pages are smaller then, so a route can
  # pass every budget in CI and still stop the production build at its limit,
  # as /compatibility/ did after #556. The values are stand-ins: a flag only
  # needs to be on, the publishable and VAPID keys only need to be non-empty,
  # and the RPC URLs only need to pass build-time validation. Keep the list in
  # step with the public variables set for Production in Vercel.
  #
  # Production also has the daily email settings, and some pages read those
  # server-side variables while they are built. With the whole chain present
  # (hasDailyChartEmailProvider in src/lib/email/daily-config.ts),
  # /birth-chart/ renders the post-chart brief and loads one more chunk.
  # Without them this job measured #587's /birth-chart/ at 67.3 KB, and
  # production stopped at 70.4 KB. So the chain gets stand-ins too, and they
  # only need to pass the same presence and length checks. PUBLIC_SUPABASE_URL
  # reaches production's build even though the project's own variable list in
  # Vercel does not show it. Nothing in this job sends email or contacts
  # Supabase.
  production-flags-build:
    name: Build with production's feature flags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_COMPAT_INVITES_ENABLED: "1"
      PUBLIC_REGISTRY_AURA_ENABLED: "1"
      PUBLIC_REGISTRY_COLLECTION_ENABLED: "1"
      PUBLIC_REGISTRY_TRADE_ENABLED: "1"
      PUBLIC_SAVED_RECORDS_ENABLED: "1"
      PUBLIC_WEEKLY_DIGEST_ENABLED: "1"
      PUBLIC_ZODIAC_GAMES_ENABLED: "1"
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_stand_in
      PUBLIC_VAPID_KEY: ci-stand-in-vapid-public-key
      PUBLIC_PLAUSIBLE_SCRIPT_URL: https://plausible.io/js/script.js
      SOLANA_RPC_URL: https://production-flags-ci.invalid/rpc
      BASE_RPC_URL: https://production-flags-ci.invalid/base
      PUBLIC_SUPABASE_URL: https://production-flags-ci.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci_stand_in_service_role
      DAILY_EMAIL_ENABLED: "1"
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_stand_in_sending
      RESEND_CONTACTS_API_KEY: re_ci_stand_in_contacts
      RESEND_FROM_EMAIL: "Zodiacs.org <ci@production-flags-ci.invalid>"
      RESEND_DAILY_SEGMENT_ID: ci_stand_in_daily_segment
      EMAIL_CONFIRM_SECRET: ci-stand-in-confirm-secret-00000000000000000000
      DAILY_EMAIL_UNSUBSCRIBE_SECRET: ci-stand-in-unsubscribe-secret-000000000000000
      DAILY_EMAIL_RECIPIENT_HASH_SECRET: ci-stand-in-recipient-secret-0000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The build's last steps are the dist integrity checks and the route
      # budgets (report-bundles --fail), the same gates Vercel runs.
      - name: Build, dist checks and route budgets (production flags on)
        run: npm run build

  # The birthplace clock's tables (src/data/tz-lmt.json and
  # src/data/tz-history/) must match the pinned tzdb release they are built
  # from. The generators download it (and check its SHA-256) and compile it
  # with zic from libc-bin; they use Node built-ins only, so no npm install.
  tz-data-drift:
    name: Time zone data drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Local mean time eras match tzdb
        run: node scripts/build-tz-lmt.mjs --check

      - name: Zone history before 1970 matches tzdb
        run: node scripts/build-tz-history.mjs --check
