name: Registry Market Snapshot

# Archives one public, UTC-dated observation of the twelve canonical Solana
# mints. DexScreener's public token batch requires no project secret.
on:
  schedule:
    - cron: "53 6 * * *" # Backstop after the midnight Daily Sky run.
  workflow_run:
    workflows: ["Daily Sky"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: daily-publication-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Archive daily market context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Scheduled events and workflow_run events can retain the SHA that
          # created the event. Always read the current published Daily Sky
          # revision; manual branch runs remain branch-local.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Require today's committed Daily Sky
        run: |
          echo "TARGET_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "VERIFIED_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          TARGET_DATE=$(date -u +%F) node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const daily = JSON.parse(await readFile('src/data/daily.json', 'utf8'));
          const target = process.env.TARGET_DATE;
          if (daily.date !== target || !daily.snapshotAt?.startsWith(`${target}T`)) {
            throw new Error(
              `Registry outlook requires Daily Sky ${target}; committed facts are ${daily.date ?? 'undated'}`,
            );
          }
          NODE

      # Daily Sky normally commits the paired observation in its one publish.
      # Repair missing/stale observations, but never refresh a valid one merely
      # because workflow_run or the scheduled backstop fired again today.
      - name: Ensure today's public market snapshot
        run: node scripts/daily-market-snapshot.mjs

      - name: Publish the paired daily and weekly outlook
        run: node scripts/build-registry-outlook.mjs

      - name: Generate deterministic Registry Research drafts and approved feeds
        run: node scripts/build-registry-research.mjs

      # The catalogue pages bake the archived numbers. Committing the data
      # without them leaves the legacy-wing drift gate red on every ref of
      # the branch until someone regenerates by hand.
      - name: Regenerate the catalogue pages that render the snapshot
        run: node scripts/build-sign-pages.mjs

      - name: Require current, internally paired artifacts
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [history, outlook, researchDrafts, researchPublication, researchFeed] = await Promise.all([
            readFile('public/assets/data/registry-market-history.v1.json', 'utf8').then(JSON.parse),
            readFile('public/assets/registry-outlook.json', 'utf8').then(JSON.parse),
            readFile('src/data/registry-research/drafts.json', 'utf8').then(JSON.parse),
            readFile('src/data/registry-research/publication.json', 'utf8').then(JSON.parse),
            readFile('public/assets/registry-research-feed.json', 'utf8').then(JSON.parse),
          ]);
          const latest = history.snapshots?.at(-1);
          const dates = {
            market: latest?.date,
            marketRead: latest?.source?.readAt?.slice(0, 10),
            dailyOutlook: outlook.daily?.date,
            weeklyOutlook: outlook.weekly?.date,
            researchDrafts: researchDrafts.generatedAt?.slice(0, 10),
            researchPublication: researchPublication.generatedAt?.slice(0, 10),
            researchFeed: researchFeed.generatedAt?.slice(0, 10),
          };
          for (const [label, date] of Object.entries(dates)) {
            if (date !== process.env.TARGET_DATE) {
              throw new Error(`${label} artifact is ${date ?? 'undated'}; expected ${process.env.TARGET_DATE}`);
            }
          }
          NODE

      - name: Commit if today's observation changed
        env:
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="public/assets/data/registry-market-history.v1.json public/assets/registry-outlook.json src/data/registry-research/drafts.json src/data/registry-research/publication.json public/assets/registry-research-feed.json public/assets/data/registry-research public/registry"
          if git diff --quiet -- $FILES; then
            echo "Registry market history and outlook unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Archive Registry market snapshot $(date -u +%F)"

          # These artifacts were generated and checked against one exact
          # Daily Sky/code revision. Never rebase them onto a revision the
          # checks above did not exercise; a later workflow_run/backstop can
          # regenerate from the newer branch tip.
          git fetch origin "$TARGET_BRANCH"
          remote_sha=$(git rev-parse "origin/$TARGET_BRANCH")
          if [ "$remote_sha" != "$VERIFIED_BASE_SHA" ]; then
            echo "Target branch advanced after artifact verification; rerun the workflow" >&2
            exit 1
          fi
          # A protected target branch requires a pull request (GH006 on a
          # direct push): try the direct push, then publish the same verified
          # commit through a pull request the workflow opens and merges itself.
          if ! git push origin "HEAD:$TARGET_BRANCH" 2>"$RUNNER_TEMP/publish-push.err"; then
            cat "$RUNNER_TEMP/publish-push.err" >&2
            if grep -q "GH006" "$RUNNER_TEMP/publish-push.err"; then
              bash scripts/publish-through-pr.sh "$TARGET_BRANCH" "$VERIFIED_BASE_SHA" "$(git log -1 --format=%s)"
            else
              echo "Target branch advanced during publish; rerun the workflow" >&2
              exit 1
            fi
          fi
