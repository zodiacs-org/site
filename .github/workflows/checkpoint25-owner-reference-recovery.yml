           assert len(actual)==expected['bytes'] and hashlib.sha256(actual).hexdigest()==expected['sha256']
           assert row['captured']['height']-row['old']['height']==(0 if row['retained']=='exact old mobile bytes' else 13)
          if os.environ.get('IMAGE_FILE'):
           file=os.environ['IMAGE_FILE']
           assert file in changed
           path='tests/visual/baselines/linux/'+file
           data=archive.read(path)
           row=next(row for row in proof['records'] if row['file']==file)
           assert len(data)==row['captured']['bytes'] and hashlib.sha256(data).hexdigest()==row['captured']['sha256']
           export(path,data)
          else:
           export(root+'owner-visual-reference.json',archive.read('owner-reference.json'))
           with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('differing='+json.dumps(changed,separators=(',',':'))+'\n')
           print('OWNER_REFERENCE_RECOVERY '+json.dumps({'artifact':11666596282,'verifiedZipSha256':hashlib.sha256(packed).hexdigest(),'crcVerified':True,'actual':15,'differing':changed},separators=(',',':')))
                    RECOVER
