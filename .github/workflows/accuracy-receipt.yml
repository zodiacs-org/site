name: Accuracy Receipt

on:
  workflow_dispatch:

concurrency:
  group: accuracy-receipt
  cancel-in-progress: false

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect and verify the receipt
        run: |
          ACCURACY_AUDIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" node scripts/accuracy-receipt.mjs
          node scripts/accuracy-receipt.mjs --verify
          npm exec -- vitest run scripts/swiss-output-guard.test.mjs

      - name: Retain suite responses and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accuracy-suite-answers
          path: ${{ runner.temp }}/zodiacs-accuracy-audit/*/suite-responses/
          if-no-files-found: ignore

      - name: Retain the raw answers if the check stops
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accuracy-raw-answers
          path: src/data/accuracy/raw/
          if-no-files-found: ignore

      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/accuracy-report.md"
          node scripts/accuracy-receipt.mjs --report > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          date=$(node -p 'require("./src/data/accuracy/latest.json").date')
          title="NASA accuracy receipt for $date"
          if node -e 'process.exit(Object.values(require("./src/data/accuracy/latest.json").sets).some(s => s.within !== s.total) ? 0 : 1)'; then
            title="ATTENTION: $title"
          fi

          branch="accuracy-receipt/$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add -- src/data/accuracy/latest.json src/data/accuracy/history.json "src/data/accuracy/raw/$date/"
          git -c user.name="Zodiacs Admin" -c user.email=admin@zodiacs.org commit -m "$title"
          git push origin "HEAD:refs/heads/$branch"

          body="$RUNNER_TEMP/accuracy-pr.md"
          {
            printf "Before: The site held the previous NASA accuracy receipt, if one had been accepted.\n\n"
            printf "After: This branch holds the new comparison, summary row and original NASA responses.\n\n"
            cat "$report"
            printf "\n[Suite responses and checksums](%s/%s/actions/runs/%s).\n" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf "\n## How\n\nThe receipt script checked the vendored engine and verified the hashes of the raw responses.\n"
            printf "\n## Tests that fail before and pass after\n\nThe receipt verification checks the new positions, snapshot and raw hashes.\n"
            printf "\n## What the owner must decide\n\nReview the receipt before accepting it.\n"
          } > "$body"
          gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$body"
