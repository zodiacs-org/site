name: Recapture Claude directory screenshots (temporary)

# Temporary: re-makes the Claude directory carousel screenshots with the
# invented example details and commits them back to this one branch.
# Removed again before the pull request is ready.
on:
  push:
    branches:
      - growth/claude-directory-shots-invented

permissions:
  contents: read

concurrency:
  group: recapture-directory-shots
  cancel-in-progress: false

jobs:
  recapture:
    name: Recapture the directory screenshots
    # Never run on the screenshot commit this job pushes back.
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[directory-shots-recapture]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SHOTS_DIR: docs/platform/zodiacs-ai/claude-directory
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Capture the screenshots
        run: |
          set +e
          npx vite-node --script tests/claude-directory-shots.ts > "$RUNNER_TEMP/shots.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/shots.log"
          if [ $status -ne 0 ]; then
            echo "::error title=claude-directory-shots failed::$(tail -n 40 "$RUNNER_TEMP/shots.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $status
          fi

      - name: Commit the screenshots
        run: |
          set -euo pipefail
          # The hosted copies under public/assets/ai/review/ are published
          # directory URLs and stay as they are.
          git checkout -- public/assets/ai/review/
          file "$SHOTS_DIR"/0*.png
          git add "$SHOTS_DIR"/0*.png "$SHOTS_DIR"/screenshots.json
          git status --short
          git -c user.name="Zodiacs Admin" -c user.email=admin@zodiacs.org commit -q -m "Recapture the Claude directory screenshots with the invented examples [directory-shots-recapture]"
          git push origin HEAD:growth/claude-directory-shots-invented
