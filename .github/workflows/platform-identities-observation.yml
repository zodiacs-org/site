name: Published platform identities observation
on:
  push:
    branches: ['codex/developer-docs-preparation']
    paths: ['scripts/observe-published-platform-identities.mjs', '.github/workflows/platform-identities-observation.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify only existing public engine, npm and PyPI identities
        run: node scripts/observe-published-platform-identities.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-identities-${{ github.run_id }}
          path: platform-identities-observation.json
          retention-days: 90
