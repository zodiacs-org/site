name: Pulse Refresh

# Refreshes public/assets/pulse.json (Wikipedia pageviews + Google Trends
# snapshot for The Pulse). Trends is best-effort — when Google rate-limits
# the runner, the previous snapshot is kept and only Wikipedia updates.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh pulse data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pulse data
        run: node scripts/build-pulse.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet public/assets/pulse.json; then
            echo "pulse.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pulse.json
          git commit -m "Refresh pulse data"
          git push
