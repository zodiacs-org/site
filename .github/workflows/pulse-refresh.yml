name: Pulse Refresh

# Refreshes public/assets/pulse.json (Wikipedia pageviews + Google Trends
# snapshot for The Pulse). Trends is best-effort — when Google rate-limits
# the runner, the previous snapshot is kept and only Wikipedia updates.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: pulse-refresh-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh pulse data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Build pulse data
        run: node scripts/build-pulse.mjs

      - name: Commit if changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet public/assets/pulse.json; then
            echo "pulse.json unchanged"
            exit 0
          fi
          VERIFIED_BASE_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pulse.json
          git commit -m "Refresh pulse data"
          # The protected default branch requires a pull request (GH006 on a
          # direct push): try the direct push, then publish the same commit
          # through a pull request the workflow opens and merges itself.
          if ! git push origin "HEAD:$DEFAULT_BRANCH" 2>"$RUNNER_TEMP/publish-push.err"; then
            cat "$RUNNER_TEMP/publish-push.err" >&2
            if grep -q "GH006" "$RUNNER_TEMP/publish-push.err"; then
              bash scripts/publish-through-pr.sh "$DEFAULT_BRANCH" "$VERIFIED_BASE_SHA" "$(git log -1 --format=%s)"
            else
              echo "Default branch advanced during publish; rerun the workflow" >&2
              exit 1
            fi
          fi
