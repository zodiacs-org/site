name: Homepage welcome loading source preflight and exact-width captures
on:
  push:
    branches: [codex/developer-docs-preparation]
    paths: [.github/workflows/checkpoint25-home-preflight.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPTURE_TARGET_SHA: '2e08e201aea43b7e23fed8723363213ea1ff82df'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CAPTURE_TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 4
      - name: Verify exact source and original protected-scope guard
        run: |
          test "$(git rev-parse HEAD)" = "$CAPTURE_TARGET_SHA"
          node scripts/phase1-scope-guard.mjs --base 943d11decff8c5cd417d315637aac2cf8c55fa01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Original build and source/dist checks
        run: npm run build
      - name: Original consumer boundary, footer and type checks
        run: npm run check
      - name: Existing home and thesis source contracts
        run: npx vitest run scripts/home-first-paint.test.mjs tests/thesis-contract.test.mjs scripts/inline-thesis-footer.test.mjs
      - name: Actual held and failed poster preserve automatic welcome hydration
        run: node tests/home-welcome-hydration-drive.mjs
      - name: Existing homepage poster and deferred motion acceptance
        run: npm run test:home-hero:browser
      - name: Existing interactive homepage preview
        run: npm run test:home-demo:browser
      - name: Existing consumer journeys including saved-chart return visits
        env:
          CONSUMER_TEST_ENGINES: chromium
        run: npm run test:consumer:browser
      - name: Existing thesis browser acceptance
        run: npm run test:thesis:browser
      - name: Original three-sample homepage and thesis gates
        env:
          LIGHTHOUSE_ROUTES: home,thesis
          LIGHTHOUSE_SAVE_ASSETS: '1'
        run: npm run test:lighthouse
      - name: Fresh captures of all nine templates at both required widths
        run: npm run test:phase1:acceptance
      - name: Original actual-capture receipt checks
        run: npm run test:phase1:evidence
      - name: Verify exact Git source and actual PNG identities
        run: |
          node --input-type=module <<'CAPTURE_EXPORT'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {relative} from 'node:path';
          import {phase1TemplateSourceSha256} from './tests/visual/phase1-evidence-contract.mjs';
          const root='docs/acceptance/phase1/screenshots/',hash=b=>createHash('sha256').update(b).digest('hex');
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8',shell:false}).trim();
          assert.equal(head,process.env.CAPTURE_TARGET_SHA);
          const bytes=await readFile(root+'manifest.json'),manifest=JSON.parse(bytes);
          assert.equal(manifest.captures.length,18);
          const rawHash=await phase1TemplateSourceSha256(process.cwd(),{readSource:absolute=>execFileSync('git',['show','HEAD:'+relative(process.cwd(),absolute).replaceAll('\\','/')],{shell:false,maxBuffer:12*1024*1024})});
          assert.equal(manifest.templateSourceSha256,rawHash);assert.equal(manifest.buildReceipt.templateSourceSha256,rawHash);
          assert.ok(Date.parse(manifest.capturedAt)>=Date.parse(manifest.buildReceipt.builtAt));
          const captures=[],names=new Set();
          for(const row of manifest.captures){
           const name=row.screenshot.file;assert.match(name,/^[a-z0-9-]+-(?:360|1280)\.png$/);
           assert.ok(!names.has(name));names.add(name);
           const actual=await readFile(root+name);assert.equal(hash(actual),row.screenshot.sha256);
           const previous=execFileSync('git',['show','HEAD:'+root+name],{shell:false,maxBuffer:12*1024*1024});
           captures.push({file:name,bytes:actual.length,sha256:hash(actual),previousTrackedBytes:previous.length,previousTrackedSha256:hash(previous),identicalToPreviousTracked:actual.equals(previous)});
           if(!actual.equals(previous))exported(root+name,actual);
          }
          const report={schema:'zodiacs.checkpoint25-home-phase1-capture.v1',producer:{workflowSource:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version},checkedOutSource:head,target:process.env.CAPTURE_TARGET_SHA,rawGitTemplateSourceSha256:rawHash,manifestSha256:hash(bytes),captures,browser:manifest.browser,capturedAt:manifest.capturedAt,builtAt:manifest.buildReceipt.builtAt,limitation:'Eighteen fresh actual captures and original receipt tests; full combined suite and production checks remain required.'};
          function exported(path,b){
           if(b.length<=49152){console.log('PROGRAMME_FILE '+JSON.stringify({path,size:b.length,sha256:hash(b),base64:b.toString('base64')}));return;}
           const chunks=Math.ceil(b.length/16384);console.log('PROGRAMME_FILE_INDEX '+JSON.stringify({path,size:b.length,sha256:hash(b),chunks}));
           for(let index=0;index<chunks;index++)console.log('PROGRAMME_FILE_CHUNK '+JSON.stringify({path,index,base64:b.subarray(index*16384,(index+1)*16384).toString('base64')}));
          }
          exported(root+'manifest.json',bytes);
          const proof=Buffer.from(JSON.stringify(report,null,2)+'\n');await writeFile('checkpoint25-home-capture-producer.json',proof);
          exported('docs/platform/evidence/home-poster-loading-20261010/phase1-capture-producer.json',proof);
          console.log('PROGRAMME_CAPTURE_SUMMARY '+JSON.stringify({actual:18,identical:captures.filter(x=>x.identicalToPreviousTracked).length,differing:captures.filter(x=>!x.identicalToPreviousTracked).map(x=>x.file)}));
          
          CAPTURE_EXPORT
      - name: Retain exact built payloads and original route samples
        if: always()
        env:
          PRECEDING_STEPS_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'HOME_PREFLIGHT_REPORT'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync,mkdirSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8',shell:false}).trim();
          assert.equal(source,process.env.CAPTURE_TARGET_SHA);
          const built={},samples=[];
          for(const [name,path] of [['home','dist/index.html'],['thesis','dist/thesis/index.html']]){
           if(existsSync(path)){const bytes=readFileSync(path);built[name]={bytes:bytes.length,sha256:hash(bytes)};}
           for(let i=1;i<=3;i++){
            const file='tests/visual/artifacts/lighthouse/'+name+'-'+i+'.json';
            if(!existsSync(file))continue;
            const bytes=readFileSync(file),lhr=JSON.parse(bytes),a=lhr.audits;
            samples.push({route:name,sample:i,bytes:bytes.length,sha256:hash(bytes),lcpMs:a['largest-contentful-paint'].numericValue,cls:a['cumulative-layout-shift'].numericValue,tbtMs:a['total-blocking-time'].numericValue,performance:lhr.categories.performance.score,accessibility:lhr.categories.accessibility.score,seo:lhr.categories.seo.score});
           }
          }
          const report={schema:'zodiacs.home-loading-changed-source-preflight.v1',producer:{workflowSource:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version},checkedOutSource:source,precedingStepsStatus:process.env.PRECEDING_STEPS_STATUS,built,samples,limitations:['Changed-source focused checks and selected original route gates only; full suite, review, post-merge and production checks remain required.','Original performance/visual thresholds, typography and image bytes are unchanged.']};
          const path='docs/platform/evidence/home-poster-loading-20261010/preflight.json',bytes=Buffer.from(JSON.stringify(report,null,2)+'\n');
          mkdirSync('docs/platform/evidence/home-poster-loading-20261010',{recursive:true});writeFileSync(path,bytes);
          console.log('PROGRAMME_FILE '+JSON.stringify({path,size:bytes.length,sha256:hash(bytes),base64:bytes.toString('base64')}));
          HOME_PREFLIGHT_REPORT
      - name: Retain actual browser, route, capture and source records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homepage-loading-source-preflight
          path: |
            tests/visual/artifacts/lighthouse/
            docs/acceptance/phase1/screenshots/
            docs/platform/evidence/home-poster-loading-20261010/
            checkpoint25-home-capture-producer.json
          if-no-files-found: error
